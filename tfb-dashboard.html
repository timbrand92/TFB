    content: '';

  @media (max-width: 480px) { .stat-grid { grid-template-columns: repeat(2,1fr); gap: 8px; } }
  /* Widget grid responsive */

  @media (max-width: 1100px) { .widget-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 640px) { .widget-grid { grid-template-columns: 1fr; gap: 10px; } }

  @media (hover: none) {

  }
  /* Hide on mobile */

  }

  }

              {(() => {
                const ROLE_MENU = {
                  'Coach':              [{label:'Profile Settings',icon:'user',href:'tfb-settings.html'},{label:'My Sessions',icon:'clipboard',href:'tfb-sessions.html'},{label:'Account & Billing',icon:'award',href:'tfb-billing.html'}],

                };
                return (ROLE_MENU[role] || ROLE_MENU['Coach']);

                <button key={item.label}

                  style={{ width: '100%', padding: '10px 16px', background: 'transparent', border: 'none', textAlign: 'left', fontSize: 13, color: 'var(--text-primary)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-body)', transition: 'background .15s' }}

                  <Icon d={icons[item.icon]} size={14} color="var(--text-secondary)" />
                  {item.label}
                </button>
              ))}
              <div style={{ borderTop: '1px solid var(--border)' }}>
                <button
                  onClick={() => { try { window.location.href = 'tfb-login.html'; } catch(e) {} }}
                  style={{ width: '100%', padding: '10px 16px', background: 'transparent', border: 'none', textAlign: 'left', fontSize: 13, color: '#E5533D', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font-body)', transition: 'background .15s' }}

                  <Icon d={icons.logout} size={14} color="#E5533D" />

        </div>
      </div>
    </header>
  );
}

}

function WidgetPicker({ onClose, onAdd, current }) {
  const [search, setSearch] = useState('');
  const [activeCat, setActiveCat] = useState('All');
  const cats = ['All', ...new Set(ALL_WIDGETS_CATALOG.map(w => w.cat))];

    (activeCat === 'All' || w.cat === activeCat) &&
    (!search || w.name.toLowerCase().includes(search.toLowerCase()) || w.desc.toLowerCase().includes(search.toLowerCase()))

  const isAdded = (id) => current && current.includes(id);
  const available = ALL_WIDGETS_CATALOG;
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300, padding: 20 }} onClick={onClose}>

        </div>
        <div style={{ padding: '14px 20px 0', borderBottom:'1px solid var(--border)' }}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search widgets..." style={{ width:'100%', padding:'9px 12px', background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:8, color:'var(--text-primary)', fontSize:13, marginBottom:10, fontFamily:'var(--font-body)', outline:'none' }} />

              <button key={c} onClick={()=>setActiveCat(c)} style={{ padding:'5px 11px', background: activeCat===c?'rgba(182,255,43,0.15)':'transparent', border:`1px solid ${activeCat===c?'rgba(182,255,43,0.4)':'var(--border)'}`, borderRadius:7, fontSize:11.5, fontWeight:700, color:activeCat===c?'#B6FF2B':'var(--text-secondary)', cursor:'pointer', whiteSpace:'nowrap', fontFamily:'var(--font-body)', letterSpacing:'0.04em' }}>{c}</button>

              return (
                <button key={w.id} disabled={added} onClick={()=>{onAdd(w.id);}} style={{ display:'flex', gap:10, padding:'12px 14px', background:added?'rgba(46,212,122,0.06)':'var(--surface-2)', border:`1px solid ${added?'rgba(46,212,122,0.25)':'var(--border)'}`, borderRadius:10, cursor:added?'default':'pointer', textAlign:'left', transition:'all .15s', fontFamily:'var(--font-body)', position:'relative', opacity:added?0.7:1 }}

                    <div style={{ fontSize:11, color:'var(--text-secondary)', lineHeight:1.4 }}>{w.desc}</div>

          if (!Comp) return null;
          // Simple mode: only show core widgets
          const SIMPLE_WIDGETS = ['nextMatch', 'quickActions', 'attendance', 'wellness'];
          if (isSimple && !SIMPLE_WIDGETS.includes(wid)) return null;
          const isWide = ['nextMatch', 'attendance', 'seasonStats'].includes(wid);
          return (
            <div key={`${wid}-${i}`} style={{
              gridColumn: isWide ? 'span 1' : 'span 1',
              position: 'relative',
              outline: editing ? '2px dashed rgba(182,255,43,0.3)' : 'none',
              borderRadius: 12,
            }}>
              {editing && (
                <button onClick={() => setWidgets(prev => prev.filter((_, j) => j !== i))}
                  style={{ position: 'absolute', top: -8, right: -8, zIndex: 10, width: 22, height: 22, borderRadius: '50%', background: '#E5533D', border: '2px solid var(--carbon-black)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                  <Icon d={icons.x} size={11} color="#fff" />
                </button>
              )}
              <Comp compact={true} />
            </div>
          );
        })}
      </div>
      {showPicker && <WidgetPicker current={widgets} onClose={() => setShowPicker(false)} onAdd={id => setWidgets(prev => prev.includes(id)?prev:[...prev, id])} />}
    </div>
  );
}

// ─── App ───────────────────────────────────────────────────────────────────
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "colorMode": "dark",
    "role": "Coach",
    "density": "comfortable",
    "teamName": "Malvern City U16",
    "accentColor": "#B6FF2B",
    "sidebarColor": "#0F3D2E",
    "fontScale": 100
  }/*EDITMODE-END*/;

  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [activeNav, setActiveNav] = useState('Dashboard');
  const [notifOpen, setNotifOpen] = useState(false);
  const [userOpen, setUserOpen] = useState(false);
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

  useEffect(() => {
    document.body.dataset.tfbHasOwnMenu = '1';
    const handle = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handle);
    return () => window.removeEventListener('resize', handle);
  }, []);

  // Apply color mode
  useEffect(() => {
    document.body.classList.toggle('light', tweaks.colorMode === 'light');
  }, [tweaks.colorMode]);

  // Apply accent + sidebar colour tokens
  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--electric-lime', tweaks.accentColor);
    root.style.setProperty('--accent', tweaks.accentColor);
    root.style.setProperty('--pitch-green', tweaks.sidebarColor);
    root.style.setProperty('--font-size-base', `${tweaks.fontScale}%`);
  }, [tweaks.accentColor, tweaks.sidebarColor, tweaks.fontScale]);

  // Apply font scale to html
  useEffect(() => {
    document.documentElement.style.fontSize = `${tweaks.fontScale}%`;
  }, [tweaks.fontScale]);

  // Close dropdowns on outside click
  useEffect(() => {
    const handle = () => { setNotifOpen(false); setUserOpen(false); };
    document.addEventListener('click', handle);
    return () => document.removeEventListener('click', handle);
  }, []);

  const sidebarW = isMobile ? 0 : (collapsed ? 64 : 240);

  return (
    <div style={{ height: '100vh', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <Header
        collapsed={collapsed}
        onToggle={() => setCollapsed(c => !c)}
        onMobileMenu={isMobile ? () => setMobileOpen(m => !m) : undefined}
        role={tweaks.role}
        notifOpen={notifOpen}
        setNotifOpen={(v) => { setNotifOpen(v); }}
        userOpen={userOpen}
        setUserOpen={(v) => { setUserOpen(v); }}
      />

      {/* Mobile sidebar overlay */}
      {isMobile && mobileOpen && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 49, backdropFilter: 'blur(2px)' }}
          onClick={() => setMobileOpen(false)}>
          <div onClick={e => e.stopPropagation()}
            style={{ width: 240, height: '100%', background: 'linear-gradient(180deg,#0A2E20,#0F3D2E)', marginTop: 'var(--header-h)', boxShadow: '4px 0 24px rgba(0,0,0,0.5)' }}>
            <Sidebar collapsed={false} activeNav={activeNav} setActiveNav={n => { setActiveNav(n); setMobileOpen(false); }} teamName={tweaks.teamName} role={tweaks.role}/>
          </div>
        </div>
      )}

      {!isMobile && (
        <Sidebar collapsed={collapsed} activeNav={activeNav} setActiveNav={setActiveNav} teamName={tweaks.teamName} role={tweaks.role}/>
      )}

      {/* Main */}
      <main style={{
        marginLeft: isMobile ? 0 : sidebarW,
        marginTop: 'var(--header-h)',
        height: `calc(100vh - var(--header-h) - ${isMobile ? 58 : 0}px)`,
        overflowY: 'auto',
        transition: 'margin-left .2s ease',
        background: 'var(--carbon-black)',
      }} className="main-content">>
        <Dashboard role={tweaks.role} density={tweaks.density} />
      </main>

      {isMobile && <MobileNav activeNav={activeNav} setActiveNav={setActiveNav} />}

      {/* Tweaks Panel */}
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={tweaks.colorMode} options={['dark','light']} onChange={v => setTweak('colorMode', v)} />
        <TweakRadio label="Density" value={tweaks.density} options={['simple','compact','comfortable','spacious']} onChange={v => setTweak('density', v)} />
        <TweakSlider label="Font Scale" value={tweaks.fontScale} min={80} max={120} step={5} unit="%" onChange={v => setTweak('fontScale', v)} />
        <TweakSection label="Branding" />
        <TweakColor label="Accent" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakColor label="Sidebar" value={tweaks.sidebarColor} onChange={v => setTweak('sidebarColor', v)} />
        <TweakSection label="Identity" />
        <TweakSelect label="Role" value={tweaks.role} options={ROLES} onChange={v => setTweak('role', v)} />
        <TweakText label="Team Name" value={tweaks.teamName} onChange={v => setTweak('teamName', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
