<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--lime:#B6FF2B;--green:#0F3D2E;--green-dark:#0A2E20;--bg:#111418;--s1:#1C2128;--s2:#242B33;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--txt:#F0F2F4;--txt2:rgba(240,242,244,0.5);--txt3:rgba(240,242,244,0.28);--goal:#2ED47A;--amber:#FFB020;--red:#E5533D;--sky:#3FA9F5;--font-d:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;--hh:54px;}
html,body,#root{height:100%;overflow:hidden}
body{font-family:var(--font-b);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font-b);color:inherit}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* Responsive */
@media (max-width: 1023px) {
  html,body,#root { height:auto; overflow:auto }
}
@media (max-width: 639px) {
  /* Force any 2-3 col grids inside settings tab content to stack */
  #root [style*="gridTemplateColumns"][style*="1fr 1fr"]:not([data-keep-grid]) { grid-template-columns: 1fr !important; }
  /* Force fixed-width inputs/selects to fluid */
  #root input[type="text"], #root input[type="email"], #root input[type="tel"], #root input[type="password"], #root select, #root textarea { max-width:100%; }
  /* Sticky save button on mobile becomes full-width */
  .hide-scrollbar::-webkit-scrollbar { display:none; }
}
</style>

const P={

};

// Detect logged-in role from dashboard tweaks (localStorage or inline JSON)
function getCurrentRole(){
  try{const v=localStorage.getItem('tfb_role');if(v)return v;
    const m=document.documentElement.innerHTML.match(/EDITMODE-BEGIN\*\/([\s\S]*?)\/\*EDITMODE-END/);
    if(m)return JSON.parse(m[1]).role||'Coach';
  }catch(e){} return 'Coach';
}

function Header({onBack}){return(<header style={{height:'var(--hh)',background:`linear-gradient(90deg,${C.greenDark},${C.green})`,borderBottom:'1px solid rgba(182,255,43,0.18)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',flexShrink:0,zIndex:50}}>
  <div style={{display:'flex',alignItems:'center',gap:12}}>
    <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'rgba(255,255,255,0.7)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all .15s'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(182,255,43,0.12)';e.currentTarget.style.color='#B6FF2B'}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.07)';e.currentTarget.style.color='rgba(255,255,255,0.7)'}}>
      <Ic d={P.back} size={14} color="currentColor"/> Dashboard
    </button>
    <div style={{width:1,height:24,background:'rgba(255,255,255,0.12)'}}/>
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#0F3D2E" stroke="#B6FF2B" strokeWidth="1.5"/><text x="20" y="26" textAnchor="middle" fill="#B6FF2B" fontFamily="Barlow Condensed" fontWeight="900" fontSize="13">TFB</text></svg>
      <div><div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:17,color:'#fff',letterSpacing:'0.04em',lineHeight:1}}>SETTINGS</div><div style={{fontSize:9.5,color:'rgba(182,255,43,0.65)',fontWeight:700,letterSpacing:'0.1em'}}>Account & Club Configuration</div></div>
    </div>
  </div>
</header>);}

function Toggle({value,onChange}){return(<button onClick={()=>onChange(!value)} style={{position:'relative',width:40,height:22,borderRadius:11,background:value?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(255,255,255,0.12)',border:'none',cursor:'pointer',transition:'background .2s',padding:0,flexShrink:0}}>
  <div style={{position:'absolute',top:2,left:value?'calc(100% - 20px)':2,width:18,height:18,borderRadius:'50%',background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,0.3)',transition:'left .2s'}}/>
</button>);}

function Field({label,value,onChange,type='text',placeholder,hint}){
  const [v,setV]=useState(value);
  return(<div>
    <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}}>{label}</div>
    <input type={type} value={v} onChange={e=>{setV(e.target.value);onChange&&onChange(e.target.value);}} placeholder={placeholder}
      style={{width:'100%',padding:'9px 12px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:13,outline:'none',transition:'border-color .15s'}}
      onFocus={e=>e.target.style.borderColor='rgba(182,255,43,0.4)'} onBlur={e=>e.target.style.borderColor=C.border2}/>
    {hint&&<div style={{fontSize:11,color:C.txt3,marginTop:4}}>{hint}</div>}
  </div>);}

function Section({title,children}){return(<div style={{background:C.s1,borderRadius:12,border:`1px solid ${C.border}`,overflow:'hidden',marginBottom:16}}>
  <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,background:'rgba(182,255,43,0.03)'}}>
    <div style={{fontSize:13,fontWeight:700,color:C.txt}}>{title}</div>
  </div>
  <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:14}}>{children}</div>
</div>);}

function Row({label,desc,children}){return(<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
  <div style={{flex:1}}>
    <div style={{fontSize:13,fontWeight:600,color:C.txt}}>{label}</div>
    {desc&&<div style={{fontSize:11,color:C.txt3,marginTop:2}}>{desc}</div>}
  </div>
  {children}
</div>);}

// ── Tab content ───────────────────────────────────────────────────────────────
function ProfileTab({user, role}){
  const [first, last] = (user.full||'').split(' ');
  return(<div>
    <Section title="Personal Information">
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:4}}>
        <div style={{width:64,height:64,borderRadius:'50%',background:`linear-gradient(135deg,${C.lime},#68B42E)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <span style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:22,color:C.green}}>{user.initials}</span>
        </div>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.txt,marginBottom:2}}>{user.full}</div>
          <div style={{fontSize:12,color:C.txt3}}>{user.email}</div>
          <button style={{marginTop:6,padding:'4px 12px',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.border2}`,borderRadius:7,fontSize:11,fontWeight:700,color:C.txt2,cursor:'pointer'}}>Change Photo</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Field label="First Name" value={first||''} placeholder="First name"/>
        <Field label="Last Name" value={last||''} placeholder="Last name"/>
      </div>
      <Field label="Email Address" type="email" value={user.email} hint="Used for login and notifications"/>
      <Field label="Phone Number" type="tel" value={user.phone}/>
      <div>
        <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}}>Role</div>
        <div style={{padding:'9px 12px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,fontSize:13,color:C.txt,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span>{user.roleLabel}</span>
          <span style={{fontSize:10,fontWeight:700,color:C.goal,background:'rgba(46,212,122,0.12)',border:'1px solid rgba(46,212,122,0.25)',borderRadius:4,padding:'2px 7px'}}>ACTIVE</span>
        </div>
      </div>
    </Section>
    <Section title="Change Password">
      <Field label="Current Password" type="password" value="" placeholder="Enter current password"/>
      <Field label="New Password" type="password" value="" placeholder="Min. 8 characters"/>
      <Field label="Confirm New Password" type="password" value="" placeholder="Repeat new password"/>
      <button style={{padding:'10px 20px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:9,fontSize:13,fontWeight:800,color:C.green,cursor:'pointer',alignSelf:'flex-start'}}>Update Password</button>
    </Section>
    <Section title="Danger Zone">
      <Row label="Deactivate Account" desc="Temporarily disable your account. Your data will be preserved.">
        <button style={{padding:'7px 14px',background:'transparent',border:`1px solid rgba(255,176,32,0.4)`,borderRadius:8,fontSize:12,fontWeight:700,color:C.amber,cursor:'pointer'}}>Deactivate</button>
      </Row>
      <Row label="Delete Account" desc="Permanently delete your account and all associated data. This cannot be undone.">
        <button style={{padding:'7px 14px',background:'transparent',border:`1px solid rgba(229,83,61,0.4)`,borderRadius:8,fontSize:12,fontWeight:700,color:C.red,cursor:'pointer'}}>Delete Account</button>
      </Row>
    </Section>
  </div>);}

function NotificationsTab(){
  const [prefs,setPrefs]=useState({email_match:true,email_availability:true,email_wellness:false,email_chat:false,push_match:true,push_availability:true,push_wellness:true,push_chat:true,digest:true,digest_freq:'daily'});
  const set=(k,v)=>setPrefs(p=>({...p,[k]:v}));
  return(<div>
    <Section title="Email Notifications">
      {[['email_match','Match & fixture updates','Upcoming matches, results, and changes'],['email_availability','Availability requests','When availability requests are sent or responses received'],['email_wellness','Wellness alerts','When players submit or flag wellness concerns'],['email_chat','Team chat messages','Direct messages and @mentions in team chat']].map(([k,label,desc])=>(
        <Row key={k} label={label} desc={desc}><Toggle value={prefs[k]} onChange={v=>set(k,v)}/></Row>
      ))}
    </Section>
    <Section title="Push Notifications">
      {[['push_match','Match alerts'],['push_availability','Availability responses'],['push_wellness','Wellness check-in reminders'],['push_chat','Chat messages']].map(([k,label])=>(
        <Row key={k} label={label}><Toggle value={prefs[k]} onChange={v=>set(k,v)}/></Row>
      ))}
    </Section>
    <Section title="Weekly Digest">
      <Row label="Send weekly digest" desc="Summary of team activity, upcoming schedule and player health">
        <Toggle value={prefs.digest} onChange={v=>set('digest',v)}/>
      </Row>
      {prefs.digest&&<div>
        <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>Frequency</div>
        <div style={{display:'flex',gap:6}}>
          {['daily','weekly'].map(f=>(
            <button key={f} onClick={()=>set('digest_freq',f)} style={{flex:1,padding:'7px',background:prefs.digest_freq===f?'rgba(182,255,43,0.12)':'transparent',border:`1px solid ${prefs.digest_freq===f?'rgba(182,255,43,0.35)':C.border}`,borderRadius:7,fontSize:12,fontWeight:700,color:prefs.digest_freq===f?C.lime:C.txt2,cursor:'pointer',textTransform:'capitalize'}}>{f}</button>
          ))}
        </div>
      </div>}
    </Section>
  </div>);}

function PrivacyTab(){
  const [s,setS]=useState({two_factor:false,session_timeout:'30min',data_sharing:true,analytics:true,login_alerts:true});
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  return(<div>
    <Section title="Account Security">
      <Row label="Two-Factor Authentication" desc="Add an extra layer of security with SMS or authenticator app">
        <Toggle value={s.two_factor} onChange={v=>set('two_factor',v)}/>
      </Row>
      <div>

      <div style={{fontSize:12,color:C.txt2,lineHeight:1.5,marginBottom:4}}>

        return(<Row key={n} label={n} desc={d}><Toggle value={v} onChange={sV}/></Row>);
      })}
    </Section>
  </div>);}

            <div style={{display:'flex',flexDirection:'column',gap:3}}>
              {m.feats.map(f=>(

                  <Ic d={P.check} size={11} color={on?C.lime:C.txt3} stroke={2.5}/>{f}

    <div style={{position:'sticky',bottom:8,background:`linear-gradient(135deg,${C.greenDark},${C.green})`,border:'1px solid rgba(182,255,43,0.3)',borderRadius:12,padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8}}>
      <div>
        <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.55)',letterSpacing:'0.08em',textTransform:'uppercase'}}>Estimated total</div>

function getTabContent(tab, user, role){
  switch(tab){
    case 'profile': return <ProfileTab user={user} role={role}/>;
    case 'display': return <DisplayTab/>;
    case 'club': return <ClubTab/>;
    case 'users': return <UserManagementTab/>;
    case 'permissions': return <PermissionsTab/>;
    case 'features': return <FeaturesTab/>;
    case 'children': return <ChildrenTab/>;
    case 'notifications': return <NotificationsTab/>;
    case 'privacy': return <PrivacyTab/>;
    case 'branding': return <BrandingTab/>;
    case 'subscription': return <SubscriptionTab/>;
    case 'data': return <DataTab/>;
    default: return <ProfileTab user={user} role={role}/>;
  }
}

function App(){
  React.useEffect(()=>{ document.body.dataset.tfbHasOwnMenu='1'; },[]);
  const role = getCurrentRole();
  const user = ROLE_USER[role] || ROLE_USER['Coach'];
  const allowedTabs = ROLE_TABS[role] || ROLE_TABS['Coach'];
  const visibleTabs = SETTINGS_TABS.filter(t => allowedTabs.includes(t.id));
  const [tab,setTab]=useState(visibleTabs[0]?.id || 'profile');
  const bp = window.useBreakpoint ? window.useBreakpoint() : 'desktop';
  const [drawerOpen, setDrawerOpen] = useState(false);
  const isMobile = bp === 'mobile';
  const isTablet = bp === 'tablet';
  
  return(<div style={{minHeight:'100vh',height:isMobile?'auto':'100vh',display:'flex',flexDirection:'column',background:C.bg,overflow:isMobile?'visible':'hidden'}}>

      window.MobileTopBar ? <window.MobileTopBar

        onMenu={()=>setDrawerOpen(true)}

      <Header onBack={()=>{try{window.location.href='tfb-dashboard.html'}catch(e){}}}/>

    {/* Mobile drawer */}

            <div style={{fontSize:10,color:C.lime,fontWeight:700,letterSpacing:'0.04em',textTransform:'uppercase'}}>{role}</div>

          {visibleTabs.map(t=>(

              <Ic d={t.icon} size={13} color="currentColor"/>{t.label}

      </div>

    <div style={{flex:1,display:'flex',overflow:isMobile?'visible':'hidden'}}>
      {/* Desktop/Tablet sidebar */}
      {!isMobile && (

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
