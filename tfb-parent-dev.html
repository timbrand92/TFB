// ── Radar Chart ───────────────────────────────────────────────────────────────
function RadarChart({data,size=200}){
  const keys=Object.keys(data);
  const n=keys.length;
  const cx=size/2,cy=size/2;
  const r=(size/2)*0.75;
  const angle=(i)=>(Math.PI*2*i/n)-Math.PI/2;
  const pt=(i,frac)=>[cx+Math.cos(angle(i))*r*frac, cy+Math.sin(angle(i))*r*frac];

  // Grid circles
  const grids=[0.25,0.5,0.75,1.0];
  // Value polygon
  const vals=keys.map(k=>data[k]/100);
  const poly=vals.map((v,i)=>pt(i,v));
  const polyStr=poly.map(([x,y])=>`${x},${y}`).join(' ');

  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {/* Grid */}
      {grids.map(g=>(
        <polygon key={g} className="radar-bg" points={keys.map((_,i)=>pt(i,g).join(',')).join(' ')}/>
      ))}
      {/* Axes */}
      {keys.map((_,i)=>(
        <line key={i} className="radar-axis" x1={cx} y1={cy} x2={pt(i,1)[0]} y2={pt(i,1)[1]}/>
      ))}
      {/* Value fill */}
      <polygon points={polyStr} fill="rgba(182,255,43,0.15)" stroke="#B6FF2B" strokeWidth="1.5"/>
      {/* Dots */}
      {poly.map(([x,y],i)=>(
        <circle key={i} cx={x} cy={y} r={3} fill="#B6FF2B"/>
      ))}
      {/* Labels */}
      {keys.map((k,i)=>{
        const [lx,ly]=pt(i,1.22);
        const color=PILLAR_COLORS[k]||C.lime;
        return(
          <text key={k} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
            fill={color} fontSize={9} fontFamily="Barlow Condensed" fontWeight="700">
            {k.toUpperCase()}
          </text>
        );
      })}
      {/* Value labels */}
      {poly.map(([x,y],i)=>(
        <text key={`v${i}`} x={x+(x-cx)*0.2} y={y+(y-cy)*0.2} textAnchor="middle" dominantBaseline="middle"
          fill="rgba(255,255,255,0.6)" fontSize={7.5} fontFamily="Barlow" fontWeight="700">
          {Object.values(data)[i]}
        </text>
      ))}
    </svg>
  );
}

  return(
    <div style={{background:C.s1,borderRadius:12,border:`1px solid ${pc}22`,padding:'14px 16px',marginBottom:10}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>

          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
            <span style={{fontSize:10,fontWeight:700,color:pc,background:`${pc}15`,border:`1px solid ${pc}30`,borderRadius:4,padding:'1px 7px',textTransform:'uppercase',letterSpacing:'0.06em'}}>{goal.pillar}</span>
            <span style={{fontSize:10,fontWeight:700,color:statusColor,background:`${statusColor}12`,border:`1px solid ${statusColor}30`,borderRadius:4,padding:'1px 7px',textTransform:'uppercase',letterSpacing:'0.06em'}}>{statusLabel}</span>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:C.txt,lineHeight:1.4,marginBottom:8}}>{goal.goal}</div>
          {/* Progress */}
          <div style={{marginBottom:8}}>

              <span style={{fontSize:11,color:C.txt2}}>Progress</span>

            <p style={{fontSize:12,color:C.txt2,lineHeight:1.55}}>{goal.coachNote}</p>

  );
}

                    {label:'Complete',value:idpComplete,color:C.lime},
                  ].map(({label,value,color})=>(
                    <div key={label} style={{background:C.s2,borderRadius:8,padding:'8px 10px',border:`1px solid ${C.border}`,textAlign:'center'}}>
                      <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:22,color,lineHeight:1}}>{value}</div>
                      <div style={{fontSize:9,color:C.txt3,marginTop:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{label}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Right — IDP goals */}
            <div>
              <div style={{fontSize:13,fontWeight:700,color:C.txt,marginBottom:14}}>Individual Development Plan Goals — 2025 Season</div>
              {p.idp.map(goal=><IDPGoalCard key={goal.id} goal={goal}/>)}
            </div>
          </div>
        )}

        {/* STATS TAB */}
        {tab==='stats'&&(
          <div style={{maxWidth:800}}>
            {/* Season numbers */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
              {[
                {label:'Appearances',value:p.season.apps,color:C.lime,icon:'🏟'},
                {label:'Goals',value:p.season.goals,color:C.goal,icon:'⚽'},
                {label:'Assists',value:p.season.assists,color:C.sky,icon:'🅰️'},
                {label:'Avg Rating',value:p.season.avgRating,color:C.amber,icon:'⭐'},
              ].map(({label,value,color,icon})=>(
                <div key={label} style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`,textAlign:'center'}}>
                  <div style={{fontSize:24,marginBottom:6}}>{icon}</div>
                  <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:36,color,lineHeight:1}}>{value}</div>
                  <div style={{fontSize:10,color:C.txt3,fontWeight:700,marginTop:4,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>
                </div>
              ))}
            </div>

            {/* Minutes played */}
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`,marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:C.txt,marginBottom:12}}>Minutes Played by Game</div>
              <div style={{display:'flex',alignItems:'flex-end',gap:6,height:80}}>
                {[82,90,90,72,90,45,90,83,90,63,0].slice(0,p.season.apps).map((mins,i)=>{
                  const color=mins>=80?C.lime:mins>=60?C.amber:C.red;
                  const isLast=i===p.season.apps-1;
                  return(
                    <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                      <span style={{fontSize:8,color:isLast?color:C.txt3,fontWeight:isLast?700:400}}>{mins}'</span>
                      <div style={{width:'100%',height:`${(mins/90)*70}px`,background:isLast?color:`${color}50`,borderRadius:'3px 3px 0 0'}}/>
                      <span style={{fontSize:8.5,color:isLast?C.lime:C.txt3}}>R{i+1}</span>
                    </div>
                  );
                })}
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:C.txt2,paddingTop:8,borderTop:`1px solid ${C.border}`,marginTop:8}}>
                <span>Total: <b style={{color:C.txt}}>{p.season.minsPlayed}'</b></span>
                <span>Avg: <b style={{color:C.txt}}>{Math.round(p.season.minsPlayed/p.season.apps)}'</b></span>
                <span>Full 90s: <b style={{color:C.txt}}>6</b></span>
              </div>
            </div>

            {/* Performance metrics */}
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:12,fontWeight:700,color:C.txt,marginBottom:12}}>Performance Metrics</div>
              {[
                {label:'Crossing Accuracy',value:'62%',bar:62,color:C.sky},
                {label:'Dribble Success',value:'58%',bar:58,color:C.lime},
                {label:'Key Passes per Game',value:'1.8',bar:60,color:C.amber},
                {label:'Sprint Distance (km/g)',value:'1.2',bar:75,color:C.goal},
                {label:'Defensive Runs Completed',value:'6.4/10',bar:64,color:C.purple},
              ].map(({label,value,bar,color})=>(
                <div key={label} style={{display:'flex',alignItems:'center',gap:12,marginBottom:9}}>
                  <span style={{fontSize:12,color:C.txt2,width:200,flexShrink:0}}>{label}</span>
                  <div style={{flex:1,height:5,background:'rgba(255,255,255,0.07)',borderRadius:3,overflow:'hidden'}}>
                    <div style={{height:'100%',width:`${bar}%`,background:color,borderRadius:3}}/>
                  </div>
                  <span style={{fontSize:12,fontWeight:700,color,minWidth:48,textAlign:'right'}}>{value}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ATTENDANCE TAB */}
        {tab==='attendance'&&(
          <div style={{maxWidth:700}}>
            {/* Summary */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
              {[
                {label:'Overall Attendance',value:`${p.attendance}%`,color:p.attendance>=85?C.goal:C.amber},
                {label:'Sessions Attended',value:`${attendedSessions}/${p.attendanceLog.length}`,color:C.lime},
                {label:'Missed',value:p.attendanceLog.filter(a=>!a.attended).length,color:C.red},
              ].map(({label,value,color})=>(
                <div key={label} style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`,textAlign:'center'}}>
                  <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:34,color,lineHeight:1}}>{value}</div>
                  <div style={{fontSize:10,color:C.txt3,fontWeight:700,marginTop:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>
                </div>
              ))}
            </div>

            {/* Log */}
            <div style={{background:C.s1,borderRadius:12,border:`1px solid ${C.border}`,overflow:'hidden'}}>
              <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.border}`,fontSize:12,fontWeight:700,color:C.txt}}>Attendance Log</div>
              {p.attendanceLog.map((a,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:`1px solid ${C.border}`,background:a.attended?'transparent':'rgba(229,83,61,0.04)'}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:a.attended?C.goal:C.red,flexShrink:0}}/>
                  <span style={{fontSize:12,fontWeight:600,color:C.txt,minWidth:56}}>{a.date}</span>
                  <span style={{fontSize:11,fontWeight:700,color:a.type==='match'?C.amber:C.sky,background:a.type==='match'?'rgba(255,176,32,0.1)':'rgba(63,169,245,0.1)',border:`1px solid ${a.type==='match'?'rgba(255,176,32,0.25)':'rgba(63,169,245,0.25)'}`,borderRadius:4,padding:'1px 7px',textTransform:'uppercase',fontSize:9}}>{a.type}</span>
                  <span style={{flex:1,fontSize:12,color:a.attended?C.goal:C.red,fontWeight:600}}>{a.attended?'Attended':'Absent'}</span>
                  {!a.attended&&a.reason&&<span style={{fontSize:11,color:C.txt3,fontStyle:'italic'}}>{a.reason}</span>}
                </div>
              ))}
            </div>

            {/* Upcoming */}
            <div style={{marginTop:20,background:C.s1,borderRadius:12,border:`1px solid ${C.border}`,overflow:'hidden'}}>
              <div style={{padding:'10px 16px',borderBottom:`1px solid ${C.border}`,fontSize:12,fontWeight:700,color:C.txt}}>Upcoming Sessions</div>
              {p.upcoming.map((ev,i)=>{
                const typeColor={match:C.amber,training:C.sky,meeting:C.goal}[ev.type]||C.txt2;
                return(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:i<p.upcoming.length-1?`1px solid ${C.border}`:'none'}}>
                    <div style={{width:36,height:36,borderRadius:8,background:`${typeColor}15`,border:`1.5px solid ${typeColor}35`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <span style={{fontSize:16}}>{ev.type==='match'?'⚽':ev.type==='training'?'🏃':'📋'}</span>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:C.txt}}>{ev.label}</div>
                      <div style={{fontSize:11,color:C.txt3,marginTop:2}}>{ev.date} · {ev.time} · {ev.location}</div>
                    </div>
                    <span style={{fontSize:9,fontWeight:700,color:typeColor,background:`${typeColor}12`,border:`1px solid ${typeColor}25`,borderRadius:4,padding:'2px 7px',textTransform:'uppercase'}}>{ev.type}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* MESSAGES TAB */}
        {tab==='messages'&&(
          <div style={{maxWidth:700}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <div style={{fontSize:13,color:C.txt2}}>Messages from the coaching staff about {p.firstName}'s development</div>
            </div>
            {p.messages.map(msg=>{
              const typeColor={feedback:C.lime,update:C.sky,review:C.amber}[msg.type]||C.txt2;
              const typeLabel={feedback:'Feedback',update:'Update',review:'IDP Review'}[msg.type]||msg.type;
              return(
                <div key={msg.id} className="fade-in" style={{background:C.s1,borderRadius:14,border:`1px solid ${C.border}`,overflow:'hidden',marginBottom:12}}>
                  <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:36,height:36,borderRadius:'50%',background:`linear-gradient(135deg,${C.lime},#68B42E)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <span style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:13,color:C.green}}>TM</span>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:13,fontWeight:700,color:C.txt}}>{msg.from}</span>
                        <span style={{fontSize:9,fontWeight:700,color:typeColor,background:`${typeColor}12`,border:`1px solid ${typeColor}25`,borderRadius:4,padding:'1px 6px',textTransform:'uppercase'}}>{typeLabel}</span>
                      </div>
                      <div style={{fontSize:11,color:C.txt3,marginTop:1}}>{msg.date}</div>
                    </div>
                  </div>
                  <div style={{padding:'14px 16px'}}>
                    <div style={{fontSize:13,fontWeight:700,color:C.txt,marginBottom:8}}>{msg.subject}</div>
                    <p style={{fontSize:13,color:C.txt2,lineHeight:1.7}}>{msg.body}</p>
                  </div>
                </div>
              );
            })}
            {/* Contact coach CTA */}
            <div style={{background:`${C.green}30`,border:'1px solid rgba(182,255,43,0.18)',borderRadius:12,padding:'16px',display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:40,height:40,borderRadius:10,background:'rgba(182,255,43,0.12)',border:'1px solid rgba(182,255,43,0.25)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Ic d={P.mail} size={20} color={C.lime}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:C.txt,marginBottom:2}}>Have a question about Oscar's development?</div>
                <div style={{fontSize:11,color:C.txt2}}>Contact Coach Tim directly via the team chat or request a meeting.</div>
              </div>
              <button onClick={()=>{try{window.location.href='tfb-chat.html'}catch(e){}}} style={{padding:'8px 16px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:8,fontSize:12,fontWeight:800,color:C.green,cursor:'pointer',whiteSpace:'nowrap'}}>
                Message Coach
              </button>
            </div>
          </div>
        )}
      </div>

      <TweaksPanel>
        <TweakSection label="Navigation"/>
        <TweakSelect label="Tab" value={tweaks.activeTab} options={['development','stats','attendance','messages']} onChange={v=>setTweak('activeTab',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
