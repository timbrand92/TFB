// ── Avatar ─────────────────────────────────────────────────────────────────────
function Avatar({player,size=40,selected=false}) {
  const initials = (player.firstName[0]||'') + (player.lastName[0]||'');
  const posColors = {GK:'#FFB020',CB:'#3FA9F5',LB:'#3FA9F5',RB:'#3FA9F5',CM:'#B6FF2B',AM:'#B6FF2B',LW:'#2ED47A',RW:'#2ED47A',ST:'#E5533D'};
  const color = posColors[player.pos] || C.lime;
  return (
    <div style={{width:size,height:size,borderRadius:'50%',background:`linear-gradient(135deg,${color}22,${color}11)`,border:`2px solid ${selected?'#fff':color+'50'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'border-color .15s'}}>
      <span style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:size*0.38,color:color,lineHeight:1}}>{initials}</span>
    </div>
  );
}

// ── Status Badge ───────────────────────────────────────────────────────────────
function StatusBadge({status,size='sm'}) {
  const labels = {available:'AVAILABLE',late:'LATE',injured:'INJURED',suspended:'SUSPENDED',unknown:'UNKNOWN'};
  const c = SC[status]||'#8A8F98';
  const p = size==='sm'?'2px 6px':'3px 9px';
  const fs = size==='sm'?9:10;
  return (
    <span style={{fontSize:fs,fontWeight:700,color:c,background:c+'15',border:`1px solid ${c}30`,borderRadius:4,padding:p,letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{labels[status]||status.toUpperCase()}</span>
  );
}

// ── Form Dots ──────────────────────────────────────────────────────────────────
function FormDots({form}) {
  return (
    <div style={{display:'flex',gap:3,alignItems:'center'}}>
      {form.map((r,i)=>(
        <div key={i} style={{width:8,height:8,borderRadius:'50%',background:r?C.goal:'rgba(255,255,255,0.15)',border:`1px solid ${r?C.goal+'60':'rgba(255,255,255,0.08)'}`}}/>
      ))}
    </div>
  );
}

// ── Wellness Bar ───────────────────────────────────────────────────────────────
function WellnessBar({value,showLabel=false}) {
  const c = value>=80?C.goal:value>=60?C.amber:C.red;
  return (
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <div style={{flex:1,height:4,background:'rgba(255,255,255,0.08)',borderRadius:2,overflow:'hidden',minWidth:40}}>
        <div style={{height:'100%',width:`${value}%`,background:c,borderRadius:2,transition:'width .4s ease'}}/>
      </div>
      {showLabel&&<span style={{fontSize:11,fontWeight:700,color:c,minWidth:28,textAlign:'right'}}>{value}%</span>}
    </div>
  );
}

// ── Squad List (left panel) ───────────────────────────────────────────────────
function SquadList({players,selected,onSelect,onAdd}) {
  const [search,setSearch] = useState('');
  const [posFilter,setPosFilter] = useState('All');
  const [statusFilter,setStatusFilter] = useState('All');
  const [sortBy,setSortBy] = useState('num');

  const filtered = players.filter(p=>{
    const q = search.toLowerCase();
    const matchSearch = !q || p.firstName.toLowerCase().includes(q) || p.lastName.toLowerCase().includes(q) || String(p.num).includes(q) || p.pos.toLowerCase().includes(q);
    const matchPos = posFilter==='All' || p.pos===posFilter;
    const matchStatus = statusFilter==='All' || p.status===statusFilter;
    return matchSearch && matchPos && matchStatus;
  }).sort((a,b)=>{
    if(sortBy==='num') return a.num-b.num;
    if(sortBy==='name') return a.lastName.localeCompare(b.lastName);
    if(sortBy==='wellness') return b.wellness-a.wellness;
    if(sortBy==='attendance') return b.attendance-a.attendance;
    return 0;
  });

  const statusCounts = {available:0,late:0,injured:0,suspended:0};
  players.forEach(p=>{ if(statusCounts[p.status]!==undefined) statusCounts[p.status]++; });

  return (
    <div style={{width:340,background:C.s1,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden'}}>
      {/* Status summary */}
      <div style={{padding:'12px 14px 0',flexShrink:0}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:12}}>
          {[['available','Fit',C.goal],['late','Late',C.amber],['injured','Injured',C.red],['suspended','Susp.',C.red]].map(([s,l,c])=>(
            <button key={s} onClick={()=>setStatusFilter(statusFilter===s?'All':s)}
              style={{background:statusFilter===s?`${c}18`:'rgba(255,255,255,0.03)',border:`1px solid ${statusFilter===s?c+'40':C.border}`,borderRadius:8,padding:'7px 4px',textAlign:'center',cursor:'pointer',transition:'all .12s'}}>
              <div style={{fontSize:18,fontWeight:900,fontFamily:'var(--font-d)',color:statusFilter===s?c:C.txt2}}>{statusCounts[s]}</div>
              <div style={{fontSize:9.5,fontWeight:700,color:statusFilter===s?c:C.txt3,letterSpacing:'0.05em'}}>{l}</div>
            </button>
          ))}
        </div>
        {/* Search */}
        <div style={{display:'flex',alignItems:'center',gap:6,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:9,padding:'7px 10px',marginBottom:8}}>
          <Ic d={P.search} size={14} color={C.txt3}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, number, position…"
            style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:13,color:C.txt}}/>
          {search&&<button onClick={()=>setSearch('')} style={{background:'transparent',border:'none',color:C.txt3,cursor:'pointer',display:'flex',padding:0}}><Ic d={P.x} size={13} color="currentColor"/></button>}
        </div>
        {/* Filters row */}
        <div style={{display:'flex',gap:6,marginBottom:10,overflowX:'auto',paddingBottom:2}}>
          {POSITIONS.map(pos=>(
            <button key={pos} onClick={()=>setPosFilter(pos)}
              style={{padding:'3px 10px',background:posFilter===pos?'rgba(182,255,43,0.15)':'transparent',border:`1px solid ${posFilter===pos?'rgba(182,255,43,0.4)':C.border}`,borderRadius:5,fontSize:11,fontWeight:700,color:posFilter===pos?C.lime:C.txt3,cursor:'pointer',whiteSpace:'nowrap',transition:'all .12s'}}>
              {pos}
            </button>
          ))}
        </div>
        {/* Sort */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:11,color:C.txt3,fontWeight:600}}>{filtered.length} player{filtered.length!==1?'s':''}</span>
          <div style={{display:'flex',gap:4}}>
            {[['num','#'],['name','Name'],['wellness','Wellness'],['attendance','Attend.']].map(([k,l])=>(
              <button key={k} onClick={()=>setSortBy(k)}
                style={{padding:'2px 7px',background:sortBy===k?'rgba(182,255,43,0.12)':'transparent',border:`1px solid ${sortBy===k?'rgba(182,255,43,0.3)':C.border}`,borderRadius:4,fontSize:10,fontWeight:700,color:sortBy===k?C.lime:C.txt3,cursor:'pointer',transition:'all .12s'}}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Player rows */}
      <div style={{flex:1,overflowY:'auto',padding:'0 8px 8px'}}>
        {filtered.map(p=>{
          const isSelected = selected?.id===p.id;
          return (
            <button key={p.id} onClick={()=>onSelect(p)}
              style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 10px',background:isSelected?'rgba(182,255,43,0.08)':'transparent',border:`1px solid ${isSelected?'rgba(182,255,43,0.3)':C.border}`,borderRadius:10,marginBottom:4,cursor:'pointer',textAlign:'left',transition:'all .12s'}}
              onMouseEnter={e=>{if(!isSelected){e.currentTarget.style.background='rgba(255,255,255,0.03)';e.currentTarget.style.borderColor=C.border2}}}
              onMouseLeave={e=>{if(!isSelected){e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor=C.border}}}>
              <Avatar player={p} size={36} selected={isSelected}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'baseline',gap:5}}>
                  <span style={{fontSize:13,fontWeight:700,color:isSelected?C.lime:C.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.firstName} {p.lastName}</span>
                  <span style={{fontSize:10,color:C.txt3,flexShrink:0}}>#{p.num}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6,marginTop:2}}>
                  <span style={{fontSize:10,fontWeight:700,color:C.txt2}}>{p.pos}</span>
                  <StatusBadge status={p.status} size="xs"/>
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4,flexShrink:0}}>
                <FormDots form={p.form}/>
                <span style={{fontSize:10,color:p.wellness>=80?C.goal:p.wellness>=60?C.amber:C.red,fontWeight:700}}>W:{p.wellness}%</span>
              </div>
            </button>
          );
        })}
        {filtered.length===0&&(
          <div style={{padding:'32px 16px',textAlign:'center',color:C.txt3,fontSize:13}}>No players match your filters</div>
        )}
      </div>

      {/* Add player button */}
      <div style={{padding:'10px 12px',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        <button onClick={onAdd} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'9px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:9,fontSize:13,fontWeight:800,color:C.green,cursor:'pointer',transition:'opacity .15s'}}
          onMouseEnter={e=>e.currentTarget.style.opacity='.88'}
          onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
          <Ic d={P.plus} size={15} color={C.green}/>
          Add Player
        </button>
      </div>
    </div>
  );
}

// ── Player Detail Panel ────────────────────────────────────────────────────────
function PlayerDetail({player,onEdit,onClose}) {

  useEffect(()=>{ setStatus(player.status); setTab('overview'); },[player.id]);

  if(!player) return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:C.txt3}}>

      <span style={{fontSize:14}}>Select a player to view details</span>
    </div>

  const TABS = ['overview','stats','wellness','idp','info'];

  return (

            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>

              <span style={{fontFamily:'var(--font-d)',fontWeight:800,fontSize:18,color:C.lime}}>#{player.num}</span>
            </div>

              <span style={{color:'rgba(255,255,255,0.2)'}}>·</span>
              <span style={{fontSize:13,color:'rgba(255,255,255,0.6)'}}>Age {player.age}</span>
              <span style={{color:'rgba(255,255,255,0.2)'}}>·</span>
              <StatusBadge status={status}/>
            </div>
          </div>
          {/* Actions */}
          <div style={{display:'flex',gap:7,flexShrink:0}}>

              onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.08)';e.currentTarget.style.color='rgba(255,255,255,0.7)'}}>

            <button onClick={onEdit} style={{padding:'7px 12px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:8,color:C.green,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5,transition:'opacity .15s'}}

          </div>
        </div>

        {/* Quick stats bar */}

            {label:'Attendance',value:`${player.attendance}%`,color:player.attendance>=85?C.goal:player.attendance>=70?C.amber:C.red},

            <div key={label} style={{background:'rgba(0,0,0,0.2)',borderRadius:8,padding:'8px 12px',border:'1px solid rgba(255,255,255,0.08)'}}>

              <div style={{fontSize:10,color:'rgba(255,255,255,0.45)',fontWeight:600,marginTop:3,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>
            </div>
          ))}

      </div>

      {/* Tabs */}
      <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,background:C.s1,flexShrink:0}}>
        {TABS.map(t=>(
          <button key={t} onClick={()=>setTab(t)}

                    <div style={{fontSize:16,fontWeight:900,fontFamily:'var(--font-d)',color:r?C.goal:C.txt3}}>{r?'✓':'✗'}</div>

                  </div>

            </div>

              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
                {[
                  {label:'Games',value:player.form.filter(Boolean).length},

                    <div style={{fontSize:10,color:C.txt3,fontWeight:600,marginTop:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* STATS & MINUTES */}
        {tab==='stats' && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {/* Season summary stats */}

                  {label:'Apps',value:player.form.filter(Boolean).length,color:C.lime},

                ].map(({label,value,color})=>(
                  <div key={label} style={{background:C.s2,borderRadius:8,padding:'12px',border:`1px solid ${C.border}`,textAlign:'center'}}>

                    <div style={{fontSize:10,color:C.txt3,fontWeight:600,marginTop:4,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>

                  const color=mins>=80?C.lime:mins>=60?C.amber:C.red;
                  return(
                    <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                      <span style={{fontSize:8,color:isLast?color:C.txt3,fontWeight:isLast?700:400}}>{mins}'</span>
                      <div style={{width:'100%',height:`${(mins/90)*70}px`,background:isLast?color:`${color}50`,borderRadius:'3px 3px 0 0',transition:'height .3s ease'}}/>

              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:C.txt2,paddingTop:8,borderTop:`1px solid ${C.border}`}}>

                <span>Avg per game: <b style={{color:C.txt}}>81'</b></span>
                <span>Full 90s: <b style={{color:C.txt}}>7</b></span>
              </div>

                  {label:'Clean Sheets',value:'4',max:10,bar:40,color:C.goal},
                  {label:'Distribution Acc.',value:'76%',max:100,bar:76,color:C.lime},

                  {label:'Shot Accuracy',value:'64%',max:100,bar:64,color:C.lime},
                  {label:'Chances Created',value:'11',max:20,bar:55,color:C.sky},

                  {label:'Interceptions',value:'19',max:30,bar:63,color:C.sky},

                  {label:'Pass Completion',value:'81%',max:100,bar:81,color:C.amber},

                  {label:'Pass Completion',value:'84%',max:100,bar:84,color:C.lime},
                  {label:'Chances Created',value:'9',max:15,bar:60,color:C.sky},
                  {label:'Tackles Won',value:'22',max:35,bar:63,color:C.goal},
                  {label:'Distance (km/g)',value:'10.8',max:14,bar:77,color:C.amber},
                ]).map(({label,value,bar,color})=>(
                  <div key={label} style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:C.txt2,width:160,flexShrink:0}}>{label}</span>
                    <div style={{flex:1,height:5,background:'rgba(255,255,255,0.07)',borderRadius:3,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${bar}%`,background:color,borderRadius:3,transition:'width .4s ease'}}/>
                    </div>
                    <span style={{fontSize:12,fontWeight:700,color,minWidth:38,textAlign:'right'}}>{value}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Substitution log */}
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>

              <div style={{display:'flex',flexDirection:'column',gap:0}}>
                {[
                  {rnd:'Rd 10',opp:'Bulleen Lions',result:'W 2-1',mins:90,rating:8.2,goals:1,assists:0},
                  {rnd:'Rd 9', opp:'North Geelong',result:'W 3-0',mins:90,rating:7.8,goals:0,assists:1},
                  {rnd:'Rd 8', opp:'Oakleigh Cannon',result:'D 1-1',mins:60,rating:6.9,goals:0,assists:0},
                  {rnd:'Rd 7', opp:'South Melbournet',result:'W 4-2',mins:90,rating:8.5,goals:2,assists:1},
                  {rnd:'Rd 6', opp:'Avondale FC',result:'L 0-1',mins:45,rating:6.2,goals:0,assists:0},
                ].map((g,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:i<4?`1px solid ${C.border}`:'none'}}>

                    <span style={{fontSize:12,color:C.txt,flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{g.opp}</span>
                    <span style={{fontSize:11,fontWeight:700,color:g.result.startsWith('W')?C.goal:g.result.startsWith('L')?C.red:C.amber,minWidth:40}}>{g.result}</span>
                    <span style={{fontSize:11,color:C.txt2,minWidth:28}}>{g.mins}'</span>
                    {g.goals>0&&<span style={{fontSize:10,background:`${C.goal}15`,border:`1px solid ${C.goal}30`,color:C.goal,borderRadius:4,padding:'1px 5px',fontWeight:700}}>⚽{g.goals}</span>}
                    {g.assists>0&&<span style={{fontSize:10,background:`${C.sky}15`,border:`1px solid ${C.sky}30`,color:C.sky,borderRadius:4,padding:'1px 5px',fontWeight:700}}>🅰️{g.assists}</span>}
                    <span style={{fontSize:11,fontWeight:800,color:g.rating>=8?C.goal:g.rating>=7?C.lime:g.rating>=6.5?C.amber:C.red,minWidth:28,textAlign:'right'}}>{g.rating}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* WELLNESS */}
        {tab==='wellness' && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:14}}>Wellness Score</div>
              <div style={{display:'flex',alignItems:'flex-end',gap:6,marginBottom:12}}>
                <span style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:56,lineHeight:1,color:player.wellness>=80?C.goal:player.wellness>=60?C.amber:C.red}}>{player.wellness}</span>
                <span style={{fontSize:16,color:C.txt3,marginBottom:8}}>/100</span>
                <span style={{fontSize:13,color:C.txt3,marginBottom:10,marginLeft:4}}>{player.wellness>=80?'Good':'Needs attention'}</span>
              </div>
              <WellnessBar value={player.wellness}/>
            </div>
            {/* Weekly wellness chart */}
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:14}}>7-Day Trend</div>
              <div style={{display:'flex',alignItems:'flex-end',gap:6,height:80}}>
                {[72,68,75,80,player.wellness-5,player.wellness-2,player.wellness].map((v,i)=>(
                  <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                    <div style={{width:'100%',height:`${(v/100)*72}px`,background:i===6?C.lime:`rgba(182,255,43,0.3)`,borderRadius:'3px 3px 0 0',transition:'height .4s ease'}}/>
                    <span style={{fontSize:9,color:i===6?C.lime:C.txt3}}>{'SMTWTFS'[i]}</span>
                  </div>
                ))}
              </div>
            </div>
            {/* Wellness categories */}
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:14}}>Categories</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {[
                  {label:'Physical Readiness',value:player.wellness+3},
                  {label:'Mental Wellbeing',value:player.wellness-5},
                  {label:'Sleep Quality',value:player.wellness+8},
                  {label:'Muscle Soreness',value:100-(100-player.wellness)*1.5|0},
                ].map(({label,value})=>(
                  <div key={label} style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:C.txt2,flex:1}}>{label}</span>
                    <div style={{width:120}}>
                      <WellnessBar value={Math.max(0,Math.min(100,value))} showLabel/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* IDP */}
        {tab==='idp' && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em'}}>IDP Goals</div>
                <span style={{fontSize:12,fontWeight:700,color:C.sky}}>{player.idpComplete}/{player.idpGoals} Complete</span>
              </div>
              {/* Progress */}
              <div style={{height:6,background:'rgba(255,255,255,0.08)',borderRadius:3,overflow:'hidden',marginBottom:14}}>
                <div style={{height:'100%',width:`${(player.idpComplete/player.idpGoals)*100}%`,background:`linear-gradient(90deg,${C.sky},#2980B9)`,borderRadius:3,transition:'width .4s ease'}}/>
              </div>
              {/* Sample goals */}
              {[
                {goal:'Improve defensive positioning off the ball',pillar:'Tactical',done:true},
                {goal:'Increase passing accuracy to 85%+ in training',pillar:'Technical',done:true},
                {goal:'Lead team warm-up twice per month',pillar:'Psychological',done:player.idpComplete>=3},
                {goal:'Complete 10+ sprints per session average',pillar:'Physical',done:false},
                {goal:'Mentor one younger squad member',pillar:'Psychological',done:false},
              ].slice(0,player.idpGoals).map((g,i)=>(
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'9px 0',borderBottom:`1px solid ${C.border}`}}>
                  <div style={{width:20,height:20,borderRadius:'50%',background:g.done?`${C.goal}20`:'rgba(255,255,255,0.05)',border:`1.5px solid ${g.done?C.goal:'rgba(255,255,255,0.15)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>
                    {g.done&&<Ic d={P.check} size={11} color={C.goal}/>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12.5,fontWeight:600,color:g.done?C.txt2:C.txt,lineHeight:1.4,textDecoration:g.done?'line-through':'none'}}>{g.goal}</div>
                    <span style={{fontSize:10,fontWeight:700,color:C.sky,marginTop:3,display:'inline-block'}}>{g.pillar}</span>
                  </div>
                </div>
              ))}
              <button style={{width:'100%',marginTop:10,padding:'8px',background:`rgba(63,169,245,0.1)`,border:`1px solid rgba(63,169,245,0.25)`,borderRadius:8,fontSize:12,fontWeight:700,color:C.sky,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,transition:'background .15s'}}
                onMouseEnter={e=>e.currentTarget.style.background='rgba(63,169,245,0.18)'}
                onMouseLeave={e=>e.currentTarget.style.background='rgba(63,169,245,0.1)'}>
                <Ic d={P.plus} size={13} color={C.sky}/> Add IDP Goal
              </button>
            </div>
          </div>
        )}

        {/* INFO */}
        {tab==='info' && (
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}}>Personal Details</div>
              {[
                {label:'Full Name',value:`${player.firstName} ${player.lastName}`},
                {label:'Date of Birth',value:player.dob},
                {label:'Age',value:`${player.age} years`},
                {label:'Email',value:player.email,icon:P.mail},
                {label:'Phone',value:player.phone,icon:P.phone},
                {label:'Parent / Guardian',value:player.parent||'—'},
              ].map(({label,value,icon})=>(
                <div key={label} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:12,color:C.txt3,width:130,flexShrink:0}}>{label}</span>
                  <span style={{fontSize:13,fontWeight:600,color:C.txt,flex:1}}>{value}</span>
                </div>
              ))}
            </div>
            <div style={{background:C.s1,borderRadius:12,padding:'16px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}}>Registration</div>
              {[
                {label:'Joined Club',value:player.joinDate},
                {label:'Contract Until',value:player.contract},
                {label:'Registration No.',value:`NPL-2025-${String(player.id).padStart(4,'0')}`},
                {label:'FFA ID',value:`FFA-${player.num*1234+5678}`},
              ].map(({label,value})=>(
                <div key={label} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:12,color:C.txt3,width:130,flexShrink:0}}>{label}</span>
                  <span style={{fontSize:13,fontWeight:600,color:C.txt}}>{value}</span>
                </div>
              ))}
            </div>
            {/* Danger zone */}
            <div style={{background:'rgba(229,83,61,0.06)',borderRadius:12,padding:'14px 16px',border:'1px solid rgba(229,83,61,0.2)'}}>
              <div style={{fontSize:11,fontWeight:700,color:C.red,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>Actions</div>
              <div style={{display:'flex',gap:8}}>
                <button style={{flex:1,padding:'8px',background:'transparent',border:`1px solid rgba(229,83,61,0.3)`,borderRadius:8,fontSize:12,fontWeight:700,color:C.red,cursor:'pointer',transition:'background .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(229,83,61,0.1)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>Mark Inactive</button>
                <button style={{flex:1,padding:'8px',background:'transparent',border:`1px solid rgba(229,83,61,0.3)`,borderRadius:8,fontSize:12,fontWeight:700,color:C.red,cursor:'pointer',transition:'background .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(229,83,61,0.1)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>Remove from Squad</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Add Player Modal ───────────────────────────────────────────────────────────
function AddPlayerModal({onClose,onAdd}) {
  const [form,setForm] = useState({firstName:'',lastName:'',pos:'CM',num:'',status:'available',email:'',phone:'',parent:'',dob:''});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const isValid = form.firstName && form.lastName && form.num;

  const handleAdd = () => {
    onAdd({
      id:Date.now(), ...form, num:parseInt(form.num)||99,
      wellness:85, attendance:100, age:17,
      joinDate:'May 2025', contract:'2026',
      form:[0,0,0,0,0], idpGoals:3, idpComplete:0,
      notes:'New player. Assessment pending.',
    });
    onClose();
  };

  const Field = ({label,k,type='text',options}) => (
    <div>
      <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}}>{label}</div>
      {options ? (
        <select value={form[k]} onChange={e=>set(k,e.target.value)}
          style={{width:'100%',padding:'8px 10px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:13,outline:'none'}}>
          {options.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      ) : (
        <input type={type} value={form[k]} onChange={e=>set(k,e.target.value)} placeholder={label}
          style={{width:'100%',padding:'8px 10px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:13,outline:'none'}}/>
      )}
    </div>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16,backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="fade-in" style={{background:C.s1,border:`1px solid ${C.border2}`,borderRadius:16,width:'100%',maxWidth:480,maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(0,0,0,0.7)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:18,color:C.lime,letterSpacing:'0.03em'}}>Add New Player</div>
          <button onClick={onClose} style={{background:'transparent',border:'none',color:C.txt2,display:'flex',cursor:'pointer'}}><Ic d={P.x} size={18} color="currentColor"/></button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Field label="First Name" k="firstName"/>
            <Field label="Last Name" k="lastName"/>
            <Field label="Squad Number" k="num" type="number"/>
            <Field label="Position" k="pos" options={POSITIONS.slice(1)}/>
            <Field label="Status" k="status" options={['available','injured','late','suspended']}/>
            <Field label="Date of Birth" k="dob" type="date"/>
          </div>
          <Field label="Email" k="email" type="email"/>
          <Field label="Phone" k="phone"/>
          <Field label="Parent / Guardian" k="parent"/>
        </div>
        <div style={{padding:'12px 20px',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
          <button onClick={handleAdd} disabled={!isValid}
            style={{width:'100%',padding:'11px',background:isValid?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(255,255,255,0.07)',border:'none',borderRadius:10,fontSize:14,fontWeight:800,color:isValid?C.green:C.txt3,cursor:isValid?'pointer':'not-allowed',fontFamily:'var(--font-b)',transition:'opacity .15s'}}>
            Add Player to Squad
          </button>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"colorMode":"dark"}/*EDITMODE-END*/;
  const [tweaks,setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  const [players, setPlayers] = useState(SQUAD);
  const [selected, setSelected] = useState(SQUAD[5]); // Beau Tremblay default
  const [showAdd, setShowAdd] = useState(false);
  const [showEdit, setShowEdit] = useState(false);

  useEffect(()=>{
    document.body.classList.toggle('light', tweaks.colorMode==='light');
  },[tweaks.colorMode]);

  const handleAdd = useCallback((p)=>{
    setPlayers(prev=>[...prev,p]);
    setSelected(p);
  },[]);

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:C.bg,overflow:'hidden'}}>
      <Header onBack={()=>{ try{window.location.href='tfb-dashboard.html';}catch(e){} }}/>

      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <SquadList
          players={players}
          selected={selected}
          onSelect={setSelected}
          onAdd={()=>setShowAdd(true)}
        />
        {selected ? (
          <PlayerDetail
            key={selected.id}
            player={selected}
            onEdit={()=>setShowEdit(true)}
            onClose={()=>setSelected(null)}
          />
        ) : (
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14,color:C.txt3}}>
            <Ic d={P.user} size={52} color="rgba(255,255,255,0.08)"/>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:15,fontWeight:600,color:C.txt2,marginBottom:4}}>Select a player</div>
              <div style={{fontSize:13,color:C.txt3}}>Click any player from the list to view their full profile</div>
            </div>
          </div>
        )}
      </div>

      {showAdd && <AddPlayerModal onClose={()=>setShowAdd(false)} onAdd={handleAdd}/>}

      <TweaksPanel>
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={tweaks.colorMode} options={['dark','light']} onChange={v=>setTweak('colorMode',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
