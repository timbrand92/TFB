<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TFB – Block Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tfb-responsive.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --lime:#B6FF2B; --green:#0F3D2E; --green-dark:#0A2E20;
  --bg:#111418; --s1:#1C2128; --s2:#242B33; --s3:#2D3640;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --txt:#F0F2F4; --txt2:rgba(240,242,244,0.5); --txt3:rgba(240,242,244,0.28);
  --goal:#2ED47A; --amber:#FFB020; --red:#E5533D; --sky:#3FA9F5;
  --font-d:'Barlow Condensed',sans-serif;
  --font-b:'Barlow',sans-serif;
  --hh:54px;
}
html,body,#root{height:100%;overflow:hidden}
body{font-family:var(--font-b);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font-b);color:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .18s ease forwards}

/* Pillar colours */
.pill-tech  {background:rgba(63,169,245,0.15);border-color:rgba(63,169,245,0.35);color:#3FA9F5}
.pill-tact  {background:rgba(182,255,43,0.12);border-color:rgba(182,255,43,0.3);color:#B6FF2B}
.pill-phys  {background:rgba(255,176,32,0.15);border-color:rgba(255,176,32,0.35);color:#FFB020}
.pill-psych {background:rgba(46,212,122,0.15);border-color:rgba(46,212,122,0.35);color:#2ED47A}
.pill-match {background:rgba(229,83,61,0.15);border-color:rgba(229,83,61,0.35);color:#E5533D}
.pill-rest  {background:rgba(138,143,152,0.15);border-color:rgba(138,143,152,0.3);color:#8A8F98}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

// ── Palette ──────────────────────────────────────────────────────────────────
const C = {
  lime:'#B6FF2B', green:'#0F3D2E', greenDark:'#0A2E20',
  bg:'#111418', s1:'#1C2128', s2:'#242B33', s3:'#2D3640',
  border:'rgba(255,255,255,0.07)', border2:'rgba(255,255,255,0.13)',
  txt:'#F0F2F4', txt2:'rgba(240,242,244,0.5)', txt3:'rgba(240,242,244,0.28)',
  goal:'#2ED47A', amber:'#FFB020', red:'#E5533D', sky:'#3FA9F5',
};

// ── Pillar system ─────────────────────────────────────────────────────────────
const PILLARS = {
  Technical:  {color:'#3FA9F5', bg:'rgba(63,169,245,0.14)',  short:'TECH',  icon:'⚽'},
  Tactical:   {color:'#B6FF2B', bg:'rgba(182,255,43,0.1)',   short:'TACT',  icon:'🧠'},
  Physical:   {color:'#FFB020', bg:'rgba(255,176,32,0.14)',  short:'PHYS',  icon:'💪'},
  Psychological:{color:'#2ED47A',bg:'rgba(46,212,122,0.12)', short:'PSYCH', icon:'🤝'},
  Match:      {color:'#E5533D', bg:'rgba(229,83,61,0.14)',   short:'MATCH', icon:'🏟'},
  Rest:       {color:'#8A8F98', bg:'rgba(138,143,152,0.1)',  short:'REST',  icon:'😴'},
};

const FC_COMPONENTS = {
  'Big Games (10v10+)':   {color:'#E5533D', abbr:'BG'},
  'Medium Games (6v9)':   {color:'#FFB020', abbr:'MG'},
  'Small Games (2v5)':    {color:'#B6FF2B', abbr:'SG'},
  'Technical Circuits':   {color:'#3FA9F5', abbr:'TC'},
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ── Session templates ─────────────────────────────────────────────────────────
const SESSION_TEMPLATES = {
  Technical: [
    'Ball Mastery & First Touch',
    'Passing & Receiving',
    'Dribbling & 1v1',
    'Crossing & Finishing',
    'Goalkeeper Technical',
    'Set Piece Delivery',
  ],
  Tactical: [
    'Pressing Shape & Triggers',
    'Build-up Play (GK + CB)',
    'Defensive Organisation',
    'Transition - Attack to Def',
    'Transition - Def to Attack',
    'Set Pieces - Attacking',
    'Set Pieces - Defending',
    'Wide Play & Overlaps',
  ],
  Physical: [
    'Speed & Acceleration',
    'Aerobic Conditioning',
    'Strength & Power',
    'Agility & Change of Direction',
    'Recovery Session',
    'Injury Prevention / Prehab',
  ],
  Psychological: [
    'Team Building',
    'Leadership Workshop',
    'Video Analysis Review',
    'Goal Setting Session',
    'Mental Skills Training',
  ],
};

// ── Generate initial block data ───────────────────────────────────────────────
function generateWeek(weekNum, startDate) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + (weekNum-1)*7);
  const dateStr = d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  const endD = new Date(d); endD.setDate(d.getDate()+6);
  const endStr = endD.toLocaleDateString('en-AU',{day:'numeric',month:'short'});

  const focusMap = {
    1:'Pre-Season Foundation',
    2:'Technical Development',
    3:'Tactical Organisation',
    4:'Physical Peak',
    5:'Match Preparation',
    6:'Taper & Peak',
  };

  // Default sessions per day
  const sessions = {};
  DAYS.forEach((day,i) => {
    if(i===0) sessions[day] = [{pillar:'Technical',title:'Ball Mastery & First Touch',duration:60,fc:'Small Games (2v5)'}];
    else if(i===2) sessions[day] = [{pillar:'Tactical',title:'Pressing Shape & Triggers',duration:75,fc:'Medium Games (6v9)'}];
    else if(i===4) sessions[day] = [{pillar:'Physical',title:'Speed & Acceleration',duration:45,fc:'Technical Circuits'}];
    else if(i===5) sessions[day] = [{pillar:'Match',title:'Match Day',duration:90,fc:'Big Games (10v10+)'}];
    else if(i===6) sessions[day] = [{pillar:'Rest',title:'Rest / Recovery',duration:0,fc:null}];
    else sessions[day] = [];
  });

  return {
    week: weekNum,
    dates: `${dateStr} – ${endStr}`,
    focus: focusMap[weekNum],
    fc: weekNum<=2?'Small Games (2v5)':weekNum<=4?'Medium Games (6v9)':'Big Games (10v10+)',
    sessions,
    collapsed: weekNum > 2,
  };
}

const START_DATE = new Date('2025-04-28');
const INITIAL_WEEKS = Array.from({length:6},(_,i)=>generateWeek(i+1,START_DATE));

// ── Icons ─────────────────────────────────────────────────────────────────────
const Ic = ({d,size=16,color='currentColor',stroke=2,fill='none'}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
    strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    {Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/>}
  </svg>
);
const P = {
  back:'M15 18l-6-6 6-6',
  plus:'M12 5v14M5 12h14',
  x:'M18 6L6 18M6 6l12 12',
  check:'M20 6L9 17l-5-5',
  chevD:'M6 9l6 6 6-6',
  chevR:'M9 18l6-6-6-6',
  edit:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  copy:['M20 9H11a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2z','M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'],
  trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',
  calendar:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z',
  list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  download:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
  clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-14v4l3 3',
  info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-14v4m0 4h.01',
  layers:['M12 2L2 7l10 5 10-5-10-5z','M2 17l10 5 10-5','M2 12l10 5 10-5'],
};

// ── Header ─────────────────────────────────────────────────────────────────────
function Header({blockName,onBack,onExport}) {
  return (
    <header style={{height:'var(--hh)',background:`linear-gradient(90deg,${C.greenDark},${C.green})`,borderBottom:'1px solid rgba(182,255,43,0.18)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',flexShrink:0,boxShadow:'0 2px 12px rgba(0,0,0,0.3)',zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'rgba(255,255,255,0.7)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all .15s',whiteSpace:'nowrap'}}
          onMouseEnter={e=>{e.currentTarget.style.background='rgba(182,255,43,0.12)';e.currentTarget.style.color='#B6FF2B'}}
          onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.07)';e.currentTarget.style.color='rgba(255,255,255,0.7)'}}>
          <Ic d={P.back} size={14} color="currentColor"/> Dashboard
        </button>
        <div style={{width:1,height:24,background:'rgba(255,255,255,0.12)'}}/>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#0F3D2E" stroke="#B6FF2B" strokeWidth="1.5"/>
            <text x="20" y="26" textAnchor="middle" fill="#B6FF2B" fontFamily="Barlow Condensed" fontWeight="900" fontSize="13">TFB</text>
          </svg>
          <div>
            <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:17,color:'#fff',letterSpacing:'0.04em',lineHeight:1}}>BLOCK PLANNER</div>
            <div style={{fontSize:9.5,color:'rgba(182,255,43,0.65)',fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase'}}>{blockName}</div>
          </div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <button onClick={onExport} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:8,color:'rgba(255,255,255,0.65)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.12)';e.currentTarget.style.color='#fff'}}
          onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.07)';e.currentTarget.style.color='rgba(255,255,255,0.65)'}}>
          <Ic d={P.download} size={13} color="currentColor"/> Export PDF
        </button>
        <div style={{width:30,height:30,borderRadius:'50%',background:'linear-gradient(135deg,#B6FF2B,#68B42E)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontSize:12,fontWeight:900,color:C.green,fontFamily:'var(--font-d)'}}>TB</span>
        </div>
      </div>
    </header>
  );
}

// ── Pillar Pill ────────────────────────────────────────────────────────────────
function PillarPill({pillar,size='sm'}) {
  const p = PILLARS[pillar];
  if(!p) return null;
  const fs = size==='sm'?9.5:11;
  return (
    <span style={{fontSize:fs,fontWeight:800,color:p.color,background:p.bg,border:`1px solid ${p.color}35`,borderRadius:4,padding:size==='sm'?'1px 6px':'2px 8px',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>
      {p.icon} {size==='sm'?p.short:pillar}
    </span>
  );
}

// ── Session Card ───────────────────────────────────────────────────────────────
function SessionCard({session,onEdit,onRemove,compact}) {
  const p = PILLARS[session.pillar];
  if(!p) return null;
  return (
    <div style={{background:p.bg,border:`1px solid ${p.color}30`,borderRadius:7,padding:compact?'5px 7px':'7px 9px',position:'relative',cursor:'pointer',transition:'all .12s',marginBottom:3}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=`${p.color}70`}
      onMouseLeave={e=>e.currentTarget.style.borderColor=`${p.color}30`}
      onClick={onEdit}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:4}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:compact?10.5:11.5,fontWeight:700,color:p.color,lineHeight:1.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{session.title}</div>
          {!compact&&session.duration>0&&<div style={{fontSize:9.5,color:'rgba(255,255,255,0.4)',marginTop:2}}>{session.duration} min{session.fc?` · ${FC_COMPONENTS[session.fc]?.abbr||''}`:''}</div>}
        </div>
        <button onClick={e=>{e.stopPropagation();onRemove()}} style={{background:'transparent',border:'none',color:'rgba(255,255,255,0.3)',cursor:'pointer',padding:0,display:'flex',flexShrink:0,transition:'color .1s'}}
          onMouseEnter={e=>e.currentTarget.style.color=C.red}
          onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,0.3)'}>
          <Ic d={P.x} size={11} color="currentColor"/>
        </button>
      </div>
    </div>
  );
}

// ── Day Cell ───────────────────────────────────────────────────────────────────
function DayCell({day,sessions,weekNum,onAddSession,onEditSession,onRemoveSession,compact}) {
  const totalMins = sessions.reduce((s,sess)=>s+(sess.duration||0),0);
  const isToday = day==='Thu'; // Demo

  return (
    <div style={{background:'rgba(255,255,255,0.02)',border:`1px solid ${isToday?'rgba(182,255,43,0.3)':C.border}`,borderRadius:9,padding:compact?'6px':8,minHeight:compact?60:80,display:'flex',flexDirection:'column',gap:3,position:'relative'}}>
      {/* Today indicator */}
      {isToday&&<div style={{position:'absolute',top:0,left:0,right:0,height:2,background:C.lime,borderRadius:'9px 9px 0 0'}}/>}

      {/* Sessions */}
      {sessions.map((sess,i)=>(
        <SessionCard
          key={i}
          session={sess}
          compact={compact}
          onEdit={()=>onEditSession(weekNum,day,i)}
          onRemove={()=>onRemoveSession(weekNum,day,i)}
        />
      ))}

      {/* Add button */}
      {sessions.length===0 ? (
        <button onClick={()=>onAddSession(weekNum,day)}
          style={{flex:1,background:'transparent',border:`1px dashed rgba(255,255,255,0.1)`,borderRadius:6,color:'rgba(255,255,255,0.2)',cursor:'pointer',fontSize:11,display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'all .15s',minHeight:40}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(182,255,43,0.3)';e.currentTarget.style.color='rgba(182,255,43,0.6)'}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.1)';e.currentTarget.style.color='rgba(255,255,255,0.2)'}}>
          <Ic d={P.plus} size={12} color="currentColor"/>
          {!compact&&<span>Add</span>}
        </button>
      ) : (
        <button onClick={()=>onAddSession(weekNum,day)}
          style={{background:'transparent',border:'none',color:'rgba(255,255,255,0.2)',cursor:'pointer',fontSize:10,padding:'2px 0',display:'flex',alignItems:'center',gap:3,transition:'color .12s'}}
          onMouseEnter={e=>e.currentTarget.style.color='rgba(182,255,43,0.6)'}
          onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,0.2)'}>
          <Ic d={P.plus} size={10} color="currentColor"/>
          {!compact&&<span>Add session</span>}
        </button>
      )}

      {/* Duration total */}
      {totalMins>0&&!compact&&(
        <div style={{fontSize:9,color:'rgba(255,255,255,0.25)',fontWeight:600,textAlign:'right',marginTop:'auto'}}>{totalMins}min</div>
      )}
    </div>
  );
}

// ── Week Row ───────────────────────────────────────────────────────────────────
function WeekRow({week,onToggle,onAddSession,onEditSession,onRemoveSession,compact}) {
  const totalSessions = Object.values(week.sessions).reduce((t,s)=>t+s.length,0);
  const pillarsUsed = [...new Set(Object.values(week.sessions).flat().map(s=>s.pillar).filter(p=>p&&p!=='Rest'))];
  const fcConfig = FC_COMPONENTS[week.fc];

  return (
    <div style={{borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
      {/* Week header */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 16px',background:C.s1,cursor:'pointer',transition:'background .12s'}}
        onClick={onToggle}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'}
        onMouseLeave={e=>e.currentTarget.style.background=C.s1}>
        {/* Collapse chevron */}
        <Ic d={week.collapsed?P.chevR:P.chevD} size={14} color={C.txt3}/>

        {/* Week number */}
        <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:20,color:C.lime,lineHeight:1,minWidth:48,flexShrink:0}}>W{week.week}</div>

        {/* Dates */}
        <div style={{fontSize:12,color:C.txt3,fontWeight:600,minWidth:120,flexShrink:0}}>{week.dates}</div>

        {/* Focus */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:700,color:C.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{week.focus}</div>
        </div>

        {/* FC Component */}
        {fcConfig&&(
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 10px',background:`${fcConfig.color}15`,border:`1px solid ${fcConfig.color}35`,borderRadius:6,flexShrink:0}}>
            <span style={{fontSize:10,fontWeight:800,color:fcConfig.color,letterSpacing:'0.04em'}}>{fcConfig.abbr}</span>
            <span style={{fontSize:9.5,color:'rgba(255,255,255,0.4)'}}>FC</span>
          </div>
        )}

        {/* Pillars used */}
        <div style={{display:'flex',gap:4,flexShrink:0}}>
          {pillarsUsed.slice(0,3).map(p=><PillarPill key={p} pillar={p} size="sm"/>)}
        </div>

        {/* Session count */}
        <div style={{fontSize:11,color:C.txt3,fontWeight:600,minWidth:56,textAlign:'right',flexShrink:0}}>
          {totalSessions} session{totalSessions!==1?'s':''}
        </div>
      </div>

      {/* Week content (days grid) */}
      {!week.collapsed && (
        <div style={{padding:'10px 16px 12px',background:C.bg}}>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${DAYS.length},1fr)`,gap:6}}>
            {DAYS.map(day=>(
              <div key={day}>
                <div style={{fontSize:10,fontWeight:700,color:day==='Thu'?C.lime:C.txt3,textAlign:'center',marginBottom:5,letterSpacing:'0.06em',textTransform:'uppercase'}}>{day}</div>
                <DayCell
                  day={day}
                  sessions={week.sessions[day]||[]}
                  weekNum={week.week}
                  onAddSession={onAddSession}
                  onEditSession={onEditSession}
                  onRemoveSession={onRemoveSession}
                  compact={compact}
                />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Session Modal (Add/Edit) ───────────────────────────────────────────────────
function SessionModal({target,existingSession,onClose,onSave}) {
  const [pillar,setPillar] = useState(existingSession?.pillar||'Technical');
  const [title,setTitle] = useState(existingSession?.title||'');
  const [duration,setDuration] = useState(existingSession?.duration||60);
  const [fc,setFc] = useState(existingSession?.fc||'');
  const [notes,setNotes] = useState(existingSession?.notes||'');

  const isValid = title.trim().length>0;
  const p = PILLARS[pillar];
  const templates = SESSION_TEMPLATES[pillar]||[];

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.82)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16,backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="fade-in" style={{background:C.s1,border:`1px solid ${C.border2}`,borderRadius:16,width:'100%',maxWidth:520,maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(0,0,0,0.7)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{padding:'14px 18px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,background:p?p.bg:'transparent'}}>
          <div>
            <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:17,color:p?.color||C.lime,letterSpacing:'0.03em'}}>
              {existingSession?'Edit Session':'Add Session'}
            </div>
            <div style={{fontSize:11,color:C.txt3,marginTop:2}}>Week {target?.week} · {target?.day}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',color:C.txt2,display:'flex',cursor:'pointer'}}><Ic d={P.x} size={18} color="currentColor"/></button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:'16px 18px',display:'flex',flexDirection:'column',gap:14}}>
          {/* Pillar picker */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Training Pillar</div>
            <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
              {Object.entries(PILLARS).map(([key,val])=>(
                <button key={key} onClick={()=>{setPillar(key);setTitle('');}}
                  style={{padding:'5px 12px',background:pillar===key?val.bg:'transparent',border:`1px solid ${pillar===key?val.color+'50':C.border}`,borderRadius:7,fontSize:12,fontWeight:700,color:pillar===key?val.color:C.txt2,cursor:'pointer',transition:'all .12s'}}>
                  {val.icon} {key}
                </button>
              ))}
            </div>
          </div>

          {/* Session title */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Session Name</div>
            <input value={title} onChange={e=>setTitle(e.target.value)} placeholder={`e.g. ${templates[0]||'Session name'}`}
              style={{width:'100%',padding:'9px 12px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:13,outline:'none',transition:'border-color .15s'}}
              onFocus={e=>e.target.style.borderColor=p?.color||C.lime}
              onBlur={e=>e.target.style.borderColor=C.border2}/>
            {/* Quick templates */}
            {templates.length>0&&(
              <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>
                {templates.map(t=>(
                  <button key={t} onClick={()=>setTitle(t)}
                    style={{padding:'3px 9px',background:title===t?(p?.bg||C.s2):C.s2,border:`1px solid ${title===t?(p?.color+'40'||C.border2):C.border}`,borderRadius:5,fontSize:11,fontWeight:600,color:title===t?(p?.color||C.lime):C.txt2,cursor:'pointer',transition:'all .12s'}}>
                    {t}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Duration + FC */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Duration</div>
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <button onClick={()=>setDuration(d=>Math.max(0,d-15))} style={{width:30,height:34,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:6,color:C.txt2,fontSize:16,cursor:'pointer'}}>−</button>
                <div style={{flex:1,height:34,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                  <span style={{fontFamily:'var(--font-d)',fontWeight:800,fontSize:18,color:C.txt}}>{duration}</span>
                  <span style={{fontSize:11,color:C.txt3}}>min</span>
                </div>
                <button onClick={()=>setDuration(d=>Math.min(180,d+15))} style={{width:30,height:34,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:6,color:C.txt2,fontSize:16,cursor:'pointer'}}>+</button>
              </div>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>FC Component</div>
              <select value={fc} onChange={e=>setFc(e.target.value)}
                style={{width:'100%',height:34,padding:'0 10px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:6,color:fc?C.txt:C.txt3,fontSize:12,outline:'none'}}>
                <option value="">None</option>
                {Object.keys(FC_COMPONENTS).map(k=><option key={k} value={k}>{k}</option>)}
              </select>
            </div>
          </div>

          {/* Notes */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Session Notes</div>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Drill descriptions, coaching points, equipment needed…"
              style={{width:'100%',height:80,padding:'9px 12px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:12,lineHeight:1.6,resize:'none',outline:'none'}}/>
          </div>
        </div>

        <div style={{padding:'12px 18px',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
          <button onClick={()=>{if(isValid)onSave({pillar,title,duration,fc,notes});}} disabled={!isValid}
            style={{width:'100%',padding:'11px',background:isValid?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(255,255,255,0.07)',border:'none',borderRadius:10,fontSize:14,fontWeight:800,color:isValid?C.green:C.txt3,cursor:isValid?'pointer':'not-allowed',fontFamily:'var(--font-b)',transition:'opacity .15s'}}>
            {existingSession?'Update Session':'Add Session'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Block Stats sidebar ────────────────────────────────────────────────────────
function BlockStats({weeks}) {
  const allSessions = weeks.flatMap(w=>Object.values(w.sessions).flat());
  const totalSessions = allSessions.length;
  const totalMins = allSessions.reduce((t,s)=>t+(s.duration||0),0);
  const byPillar = {};
  allSessions.forEach(s=>{ byPillar[s.pillar]=(byPillar[s.pillar]||0)+1; });

  return (
    <div style={{width:220,background:C.s1,borderLeft:`1px solid ${C.border}`,display:'flex',flexDirection:'column',padding:'16px 14px',gap:16,flexShrink:0,overflowY:'auto'}}>
      {/* Block summary */}
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>Block Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
          {[
            {label:'Weeks',value:weeks.length,color:C.lime},
            {label:'Sessions',value:totalSessions,color:C.sky},
            {label:'Hours',value:Math.round(totalMins/60),color:C.goal},
            {label:'Matches',value:allSessions.filter(s=>s.pillar==='Match').length,color:C.red},
          ].map(({label,value,color})=>(
            <div key={label} style={{background:C.s2,borderRadius:8,padding:'9px 10px',border:`1px solid ${C.border}`}}>
              <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:22,color,lineHeight:1}}>{value}</div>
              <div style={{fontSize:10,color:C.txt3,fontWeight:600,marginTop:2,textTransform:'uppercase',letterSpacing:'0.04em'}}>{label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Pillar breakdown */}
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>Pillar Balance</div>
        {Object.entries(PILLARS).filter(([k])=>byPillar[k]).map(([key,val])=>{
          const count = byPillar[key]||0;
          const pct = Math.round((count/totalSessions)*100);
          return (
            <div key={key} style={{marginBottom:8}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:3}}>
                <span style={{fontSize:11,fontWeight:600,color:val.color}}>{val.icon} {key}</span>
                <span style={{fontSize:10,color:C.txt3,fontWeight:700}}>{count} ({pct}%)</span>
              </div>
              <div style={{height:4,background:'rgba(255,255,255,0.06)',borderRadius:2,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${pct}%`,background:val.color,borderRadius:2,transition:'width .5s ease'}}/>
              </div>
            </div>
          );
        })}
        {totalSessions===0&&<div style={{fontSize:12,color:C.txt3}}>No sessions yet</div>}
      </div>

      {/* FC Balance */}
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>FC Components</div>
        {Object.entries(FC_COMPONENTS).map(([key,val])=>{
          const count = allSessions.filter(s=>s.fc===key).length;
          if(!count) return null;
          return (
            <div key={key} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:val.color,flexShrink:0}}/>
                <span style={{fontSize:11,color:C.txt2}}>{key.split(' ')[0]} {key.split(' ')[1]}</span>
              </div>
              <span style={{fontSize:11,fontWeight:700,color:val.color}}>{count}x</span>
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}}>Legend</div>
        {Object.entries(PILLARS).map(([key,val])=>(
          <div key={key} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
            <div style={{width:8,height:8,borderRadius:2,background:val.color,flexShrink:0}}/>
            <span style={{fontSize:11,color:C.txt2}}>{val.icon} {key}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"blockName":"Pre-Season 2025","ageGroup":"U18 Men","compact":false}/*EDITMODE-END*/;
  const [tweaks,setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  const [weeks,setWeeks] = useState(INITIAL_WEEKS);
  const [modal,setModal] = useState(null); // {week,day,sessionIdx} or null
  const [editData,setEditData] = useState(null);

  const toggleWeek = useCallback((weekNum)=>{
    setWeeks(prev=>prev.map(w=>w.week===weekNum?{...w,collapsed:!w.collapsed}:w));
  },[]);

  const handleAddSession = useCallback((weekNum,day)=>{
    setModal({week:weekNum,day});
    setEditData(null);
  },[]);

  const handleEditSession = useCallback((weekNum,day,idx)=>{
    const week = weeks.find(w=>w.week===weekNum);
    const session = week?.sessions[day]?.[idx];
    if(session){ setModal({week:weekNum,day,idx}); setEditData(session); }
  },[weeks]);

  const handleRemoveSession = useCallback((weekNum,day,idx)=>{
    setWeeks(prev=>prev.map(w=>{
      if(w.week!==weekNum) return w;
      const newSessions={...w.sessions};
      newSessions[day]=[...newSessions[day]];
      newSessions[day].splice(idx,1);
      return {...w,sessions:newSessions};
    }));
  },[]);

  const handleSaveSession = useCallback((sessionData)=>{
    if(!modal) return;
    setWeeks(prev=>prev.map(w=>{
      if(w.week!==modal.week) return w;
      const newSessions={...w.sessions};
      const arr=[...(newSessions[modal.day]||[])];
      if(modal.idx!==undefined){ arr[modal.idx]={...sessionData}; }
      else { arr.push({...sessionData}); }
      newSessions[modal.day]=arr;
      return {...w,sessions:newSessions};
    }));
    setModal(null);
    setEditData(null);
  },[modal]);

  const expandAll = () => setWeeks(prev=>prev.map(w=>({...w,collapsed:false})));
  const collapseAll = () => setWeeks(prev=>prev.map(w=>({...w,collapsed:true})));

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:C.bg,overflow:'hidden'}}>
      <Header
        blockName={`${tweaks.blockName} · ${tweaks.ageGroup}`}
        onBack={()=>{ try{window.location.href='tfb-dashboard.html';}catch(e){} }}
        onExport={()=>alert('Export to PDF coming soon!')}
      />

      {/* Toolbar */}
      <div style={{background:C.s1,borderBottom:`1px solid ${C.border}`,padding:'8px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <div style={{fontFamily:'var(--font-d)',fontWeight:800,fontSize:15,color:C.txt2,letterSpacing:'0.02em'}}>
          {tweaks.blockName}
        </div>
        <div style={{width:1,height:16,background:C.border}}/>
        <div style={{fontSize:12,color:C.txt3}}>
          {new Date(START_DATE).toLocaleDateString('en-AU',{day:'numeric',month:'short'})} – {new Date(new Date(START_DATE).setDate(START_DATE.getDate()+41)).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
        </div>
        <div style={{flex:1}}/>
        {/* Expand/collapse all */}
        <button onClick={expandAll} style={{padding:'4px 10px',background:'transparent',border:`1px solid ${C.border2}`,borderRadius:6,fontSize:11,fontWeight:600,color:C.txt3,cursor:'pointer',transition:'all .12s'}}
          onMouseEnter={e=>e.currentTarget.style.color=C.txt}
          onMouseLeave={e=>e.currentTarget.style.color=C.txt3}>Expand All</button>
        <button onClick={collapseAll} style={{padding:'4px 10px',background:'transparent',border:`1px solid ${C.border2}`,borderRadius:6,fontSize:11,fontWeight:600,color:C.txt3,cursor:'pointer',transition:'all .12s'}}
          onMouseEnter={e=>e.currentTarget.style.color=C.txt}
          onMouseLeave={e=>e.currentTarget.style.color=C.txt3}>Collapse All</button>
        {/* Compact toggle */}
        <button onClick={()=>setTweak('compact',!tweaks.compact)}
          style={{padding:'4px 10px',background:tweaks.compact?'rgba(182,255,43,0.1)':'transparent',border:`1px solid ${tweaks.compact?'rgba(182,255,43,0.3)':C.border2}`,borderRadius:6,fontSize:11,fontWeight:600,color:tweaks.compact?C.lime:C.txt3,cursor:'pointer',transition:'all .12s'}}>
          Compact
        </button>
      </div>

      {/* Main content */}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* Weeks column */}
        <div style={{flex:1,overflowY:'auto'}}>
          {/* Day headers */}
          <div style={{position:'sticky',top:0,background:C.s1,borderBottom:`1px solid ${C.border}`,padding:'6px 16px',display:'grid',gridTemplateColumns:'204px repeat(7,1fr)',gap:6,zIndex:10}}>
            <div style={{fontSize:10,fontWeight:700,color:C.txt3,display:'flex',alignItems:'center',gap:4}}>
              <Ic d={P.calendar} size={11} color={C.txt3}/> WEEK
            </div>
            {DAYS.map(d=>(
              <div key={d} style={{fontSize:10,fontWeight:800,color:d==='Thu'?C.lime:C.txt3,textAlign:'center',letterSpacing:'0.08em'}}>{d.toUpperCase()}</div>
            ))}
          </div>

          {weeks.map(week=>(
            <div key={week.week} style={{display:'grid',gridTemplateColumns:'204px 1fr',borderBottom:`1px solid ${C.border}`}}>
              {/* Week label column */}
              <div style={{background:C.s1,borderRight:`1px solid ${C.border}`,cursor:'pointer',display:'flex',flexDirection:'column',justifyContent:'flex-start',padding:'12px 14px',gap:6}}
                onClick={()=>toggleWeek(week.week)}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <Ic d={week.collapsed?P.chevR:P.chevD} size={13} color={C.txt3}/>
                  <span style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:24,color:C.lime,lineHeight:1}}>W{week.week}</span>
                </div>
                <div style={{fontSize:11,color:C.txt3,fontWeight:600,lineHeight:1.3}}>{week.dates}</div>
                <div style={{fontSize:12,fontWeight:700,color:C.txt,lineHeight:1.3}}>{week.focus}</div>
                {week.fc&&(
                  <div style={{marginTop:2}}>
                    <span style={{fontSize:9.5,fontWeight:800,color:FC_COMPONENTS[week.fc]?.color||C.txt2,background:`${FC_COMPONENTS[week.fc]?.color||'#fff'}15`,border:`1px solid ${FC_COMPONENTS[week.fc]?.color||'#fff'}30`,borderRadius:4,padding:'2px 6px',letterSpacing:'0.05em'}}>
                      {FC_COMPONENTS[week.fc]?.abbr} FC
                    </span>
                  </div>
                )}
              </div>

              {/* Days grid */}
              {week.collapsed ? (
                <div style={{background:'rgba(255,255,255,0.01)',display:'flex',alignItems:'center',padding:'12px 16px',gap:8,cursor:'pointer'}} onClick={()=>toggleWeek(week.week)}>
                  <span style={{fontSize:12,color:C.txt3}}>Click to expand</span>
                  {[...new Set(Object.values(week.sessions).flat().map(s=>s.pillar).filter(Boolean))].map(p=>(
                    <PillarPill key={p} pillar={p} size="sm"/>
                  ))}
                </div>
              ) : (
                <div style={{padding:'10px 12px 12px',background:C.bg}}>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:6}}>
                    {DAYS.map(day=>(
                      <DayCell
                        key={day}
                        day={day}
                        sessions={week.sessions[day]||[]}
                        weekNum={week.week}
                        onAddSession={handleAddSession}
                        onEditSession={handleEditSession}
                        onRemoveSession={handleRemoveSession}
                        compact={tweaks.compact}
                      />
                    ))}
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Stats sidebar */}
        <BlockStats weeks={weeks}/>
      </div>

      {/* Session modal */}
      {modal && (
        <SessionModal
          target={modal}
          existingSession={editData}
          onClose={()=>{setModal(null);setEditData(null);}}
          onSave={handleSaveSession}
        />
      )}

      {/* Tweaks */}
      <TweaksPanel>
        <TweakSection label="Block"/>
        <TweakText label="Block Name" value={tweaks.blockName} onChange={v=>setTweak('blockName',v)}/>
        <TweakText label="Age Group" value={tweaks.ageGroup} onChange={v=>setTweak('ageGroup',v)}/>
        <TweakSection label="View"/>
        <TweakToggle label="Compact View" value={tweaks.compact} onChange={v=>setTweak('compact',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
