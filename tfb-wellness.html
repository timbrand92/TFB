const P={
  back:'M15 18l-6-6 6-6',heart:'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z',
  alert:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',

  check:'M20 6L9 17l-5-5',x:'M18 6L6 18M6 6l12 12',
  send:'M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z',
  user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  chevD:'M6 9l6 6 6-6',trend:'M23 6l-9.5 9.5-5-5L1 18',

const PLAYERS=[
  {id:1,name:'J. Mitchell',pos:'GK',num:1,today:92,yesterday:88,week:[85,88,90,87,91,88,92],status:'good',notes:'',checkedIn:true,

const scoreColor=v=>!v?'#8A8F98':v>=80?C.goal:v>=65?C.amber:C.red;
const teamAvg=Math.round(PLAYERS.filter(p=>p.today).reduce((s,p)=>s+(p.today||0),0)/PLAYERS.filter(p=>p.today).length);

// ── Player Check-In Modal ─────────────────────────────────────────────────────
function CheckInModal({player,onClose,onSubmit,isPlayerView=false}){
  const [vals,setVals]=useState({physical:70,mental:70,sleep:70,soreness:70,energy:70,stress:70,notes:''});
  const set=(k,v)=>setVals(x=>({...x,[k]:v}));
  const overall=Math.round(Object.entries(vals).filter(([k])=>k!=='notes').reduce((s,[,v])=>s+v,0)/6);
  const oc=scoreColor(overall);

  const METRICS=[
    {key:'physical',label:'Physical Readiness',desc:'How does your body feel?',low:'Sore',high:'Perfect',color:C.goal},
    {key:'mental',label:'Mental Sharpness',desc:'Focus & concentration level',low:'Foggy',high:'Locked in',color:C.sky},
    {key:'sleep',label:'Sleep Quality',desc:'Last night\'s sleep',low:'Poor',high:'Great',color:'#A78BFA'},
    {key:'soreness',label:'Muscle Soreness',desc:'Soreness / stiffness',low:'Very sore',high:'None',color:C.amber},
    {key:'energy',label:'Energy Level',desc:'Overall energy & drive',low:'Flat',high:'High',color:C.lime},
    {key:'stress',label:'Stress Level',desc:'Life stress outside football (inverted)',low:'Very stressed',high:'Relaxed',color:'#F472B6'},
  ];

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16,backdropFilter:'blur(6px)'}} onClick={onClose}>
      <div className="fade-in" style={{background:C.s1,border:`1px solid ${C.border2}`,borderRadius:18,width:'100%',maxWidth:520,maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 80px rgba(0,0,0,0.8)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,background:`linear-gradient(135deg,${C.greenDark},${C.green})`}}>
          <div>
            <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:18,color:C.lime,letterSpacing:'0.03em'}}>{isPlayerView?'My Wellness Check-In':`Check-In: ${player?.name||'Player'}`}</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginTop:2}}>{new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:36,color:oc,lineHeight:1}}>{overall}</div>
            <div style={{fontSize:9,color:'rgba(255,255,255,0.4)',letterSpacing:'0.08em'}}>SCORE</div>
          </div>
        </div>

        {/* Sliders */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
          {METRICS.map(({key,label,desc,low,high,color})=>(
            <div key={key}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:C.txt}}>{label}</div>
                  <div style={{fontSize:10,color:C.txt3}}>{desc}</div>
                </div>
                <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:22,color,minWidth:36,textAlign:'right'}}>{vals[key]}</div>
              </div>
              <input type="range" min={0} max={100} step={5} value={vals[key]}
                onChange={e=>set(key,+e.target.value)}
                style={{background:`linear-gradient(to right,${color} 0%,${color} ${vals[key]}%,rgba(255,255,255,0.1) ${vals[key]}%,rgba(255,255,255,0.1) 100%)`}}/>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:9.5,color:C.txt3,marginTop:3}}>
                <span>{low}</span><span>{high}</span>
              </div>
            </div>
          ))}

          {/* Notes */}
          <div>
            <div style={{fontSize:12,fontWeight:700,color:C.txt,marginBottom:6}}>Any notes or concerns? <span style={{color:C.txt3,fontWeight:400}}>(optional)</span></div>
            <textarea value={vals.notes} onChange={e=>set('notes',e.target.value)} rows={3}
              placeholder="Niggle, illness, personal concern…"
              style={{width:'100%',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:9,color:C.txt,fontSize:13,padding:'10px 12px',resize:'none',outline:'none',lineHeight:1.6}}/>
          </div>
        </div>

        {/* Footer */}
        <div style={{padding:'12px 20px',borderTop:`1px solid ${C.border}`,flexShrink:0,display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:'10px',background:'transparent',border:`1px solid ${C.border2}`,borderRadius:10,fontSize:13,fontWeight:600,color:C.txt2,cursor:'pointer'}}>Cancel</button>
          <button onClick={()=>onSubmit({...vals,overall})} style={{flex:2,padding:'10px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:10,fontSize:13,fontWeight:800,color:C.green,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
            <Ic d={P.check} size={14} color={C.green}/> Submit Check-In
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Export Modal ──────────────────────────────────────────────────────────────
function ExportModal({onClose,players}){
  const [scope,setScope]=useState('team');
  const [format,setFormat]=useState('pdf');
  const [period,setPeriod]=useState('today');
  const [selPlayer,setSelPlayer]=useState(players[0]);

  const doExport=()=>{
    // Build printable HTML for team or individual
    const isTeam=scope==='team';
    const data=isTeam?players:[selPlayer];
    const title=isTeam?'Team Wellness Report':`${selPlayer.name} — Wellness Report`;
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<title>${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Barlow',sans-serif;background:#fff;color:#111;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:16mm;size:A4}.page{max-width:760px;margin:0 auto;padding:24px}.header{background:linear-gradient(135deg,#0A2E20,#0F3D2E);border-radius:10px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}.ht{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;color:#fff;letter-spacing:.03em}.hs{font-size:10px;color:rgba(182,255,43,.7);font-weight:700;letter-spacing:.1em;margin-top:3px;text-transform:uppercase}.score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;line-height:1}.table{width:100%;border-collapse:collapse;margin-bottom:20px}.table th{background:#f4f6f9;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555;border:1px solid #e0e4e8;text-align:left}.table td{padding:8px 12px;border:1px solid #e8ecf0;font-size:12px;vertical-align:middle}.bar-wrap{height:6px;background:#f0f2f4;border-radius:3px;overflow:hidden}.bar{height:100%;border-radius:3px}.good{color:#2ED47A}.watch{color:#FFB020}.injured{color:#E5533D}.footer{margin-top:16px;padding-top:12px;border-top:2px solid #B6FF2B;display:flex;justify-content:space-between;font-size:10px;color:#8A8F98}.fb{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#0F3D2E;font-size:13px;letter-spacing:.05em}</style>
</head><body><div class="page">
<div class="header"><div><div class="ht">The Football Blueprint</div><div class="hs">Malvern City FC · ${title}</div></div><div style="text-align:right;color:#fff"><div style="font-size:11px;opacity:.6">${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div style="font-size:10px;opacity:.4;margin-top:4px">Period: ${period==='today'?'Today':period==='week'?'This Week':'This Month'}</div></div></div>
${isTeam?`<table class="table"><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Score</th><th>Bar</th><th>Status</th><th>Notes</th></tr></thead><tbody>${data.map(p=>{const sc=p.today;const cl=!sc?'injured':sc>=80?'good':sc>=65?'watch':'injured';return`<tr><td><b>${p.num}</b></td><td>${p.name}</td><td>${p.pos}</td><td class="${cl}"><b>${sc||'–'}</b></td><td><div class="bar-wrap"><div class="bar" style="width:${sc||0}%;background:${!sc?'#8A8F98':sc>=80?'#2ED47A':sc>=65?'#FFB020':'#E5533D'}"></div></div></td><td class="${cl}">${p.status.toUpperCase()}</td><td style="color:#555;font-style:italic">${p.notes||''}</td></tr>`;}).join('')}</tbody></table>`
:`<div style="margin-bottom:20px;background:#f8fafb;border-radius:10px;border:1px solid #e0e4e8;padding:20px">
<div style="display:flex;align-items:center;gap:16;margin-bottom:16px"><div style="width:50px;height:50px;border-radius:50%;background:#0F3D2E;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#B6FF2B">${selPlayer.num}</div><div><div style="font-size:18px;font-weight:700">${selPlayer.name}</div><div style="color:#8A8F98;font-size:12px">${selPlayer.pos} · Status: ${selPlayer.status.toUpperCase()}</div></div><div style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;color:${!selPlayer.today?'#8A8F98':selPlayer.today>=80?'#2ED47A':selPlayer.today>=65?'#FFB020':'#E5533D'}">${selPlayer.today||'–'}</div></div>
${Object.entries(selPlayer.breakdown||{}).map(([k,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="text-transform:capitalize;font-weight:600">${k}</span><span style="font-weight:700;color:${v>=80?'#2ED47A':v>=65?'#FFB020':'#E5533D'}">${v}</span></div><div class="bar-wrap"><div class="bar" style="width:${v}%;background:${v>=80?'#2ED47A':v>=65?'#FFB020':'#E5533D'}"></div></div></div>`).join('')}
</div>`}
<div class="footer"><div><div class="fb">The Football Blueprint</div><div>thefootballblueprint.com.au</div></div><div style="text-align:right">Generated ${new Date().toLocaleDateString('en-AU')}</div></div>
</div></body></html>`;
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),800);}
    onClose();
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:16,backdropFilter:'blur(4px)'}} onClick={onClose}>
      <div className="fade-in" style={{background:C.s1,border:`1px solid ${C.border2}`,borderRadius:16,width:'100%',maxWidth:420,boxShadow:'0 24px 64px rgba(0,0,0,0.7)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:18,color:C.lime}}>Export Wellness Data</div>
          <button onClick={onClose} style={{background:'transparent',border:'none',cursor:'pointer',color:C.txt2,display:'flex'}}><Ic d={P.x} size={18} color="currentColor"/></button>
        </div>
        <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
          {/* Scope */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Report Scope</div>
            <div style={{display:'flex',gap:6}}>
              {['team','individual'].map(s=>(

                  {s==='team'?'👥 Full Team':'👤 Individual'}
                </button>
              ))}
            </div>
          </div>

          {/* Player picker if individual */}
          {scope==='individual'&&(
            <div>
              <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Select Player</div>
              <select value={selPlayer.id} onChange={e=>setSelPlayer(players.find(p=>p.id===+e.target.value))}
                style={{width:'100%',padding:'9px 10px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,color:C.txt,fontSize:13,outline:'none'}}>
                {players.map(p=><option key={p.id} value={p.id}>{p.name} — #{p.num} {p.pos}</option>)}
              </select>
            </div>
          )}

          {/* Period */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Period</div>
            <div style={{display:'flex',gap:6}}>
              {[['today',"Today"],['week',"This Week"],['month',"This Month"]].map(([v,l])=>(
                <button key={v} onClick={()=>setPeriod(v)} style={{flex:1,padding:'8px',background:period===v?'rgba(63,169,245,0.12)':'transparent',border:`1px solid ${period===v?'rgba(63,169,245,0.4)':C.border2}`,borderRadius:7,fontSize:11,fontWeight:700,color:period===v?C.sky:C.txt2,cursor:'pointer',transition:'all .12s'}}>{l}</button>
              ))}
            </div>
          </div>

          {/* Format */}
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:7}}>Format</div>
            <div style={{display:'flex',gap:6}}>

  const isPlayerView=tweaks.view==='player';

  const [selected,setSelected]=useState(null);
  const [showCheckin,setShowCheckin]=useState(false);
  const [checkinPlayer,setCheckinPlayer]=useState(null);
  const [showExport,setShowExport]=useState(false);

  const [fbCtx,setFbCtx]=useState(null);

  useEffect(()=>{
    if(!window.TFBApp)return;

      if(!user)return;

      if(ctx?.clubId)setFbCtx(ctx);
    });

  const needsAttention=players.filter(p=>p.status!=='good');

  const openCheckin=(p)=>{setCheckinPlayer(p||{name:'Your',id:-1});setShowCheckin(true);};

    if(checkinPlayer?.id>0){

                            <div style={{height:'100%',width:`${p.today}%`,background:sc,borderRadius:2}}/>
                          </div>
                          <span style={{fontSize:13,fontWeight:800,color:sc,minWidth:28,textAlign:'right'}}>{p.today}</span>
                        </div>
                      ):(
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:10,color:C.txt3,fontStyle:'italic'}}>Not submitted</span>
                          <button onClick={e=>{e.stopPropagation();openCheckin(p)}} style={{padding:'3px 8px',background:'rgba(182,255,43,0.1)',border:'1px solid rgba(182,255,43,0.3)',borderRadius:5,fontSize:10,fontWeight:700,color:C.lime,cursor:'pointer'}}>
                            Enter
                          </button>
                        </div>
                      )}
                      {/* trend indicator */}
                      {p.today&&p.yesterday&&(
                        <div style={{fontSize:10,color:p.today>p.yesterday?C.goal:p.today<p.yesterday?C.red:C.txt3,fontWeight:700,minWidth:24,textAlign:'right'}}>
                          {p.today>p.yesterday?'↑':p.today<p.yesterday?'↓':'→'}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {mainTab==='heatmap'&&(
            <div style={{background:C.s1,borderRadius:12,border:`1px solid ${C.border}`,padding:'16px'}}>
              <div style={{fontSize:12,fontWeight:700,color:C.txt,marginBottom:14}}>Team Wellness Heatmap — 7 Days</div>
              <div style={{overflowX:'auto'}}>
                <div style={{display:'grid',gridTemplateColumns:'90px repeat(7,1fr)',gap:3,minWidth:500}}>
                  <div/>
                  {['Mon','Tue','Wed','Thu','Fri','Sat','Today'].map(d=>(
                    <div key={d} style={{textAlign:'center',fontSize:9,color:C.txt3,fontWeight:700,padding:'3px 0'}}>{d}</div>
                  ))}
                  {players.map(p=>[
                    <div key={`n-${p.id}`} style={{fontSize:10,color:C.txt2,display:'flex',alignItems:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:6,fontWeight:600}}>{p.name}</div>,
                    ...p.week.map((v,i)=>(
                      <div key={i} style={{height:26,borderRadius:5,background:v?`${scoreColor(v)}${Math.round((v/100)*99).toString(16).padStart(2,'0')}`:'rgba(255,255,255,0.04)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'default',transition:'transform .1s'}}
                        onMouseEnter={e=>e.currentTarget.style.transform='scale(1.05)'}
                        onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
                        {v&&<span style={{fontSize:9,fontWeight:700,color:'rgba(0,0,0,0.55)'}}>{v}</span>}
                      </div>
                    ))
                  ])}
                </div>
              </div>
              <div style={{marginTop:12,display:'flex',gap:12,alignItems:'center',fontSize:10,color:C.txt3,flexWrap:'wrap'}}>
                <div style={{width:12,height:8,borderRadius:2,background:C.goal,flexShrink:0}}/><span>Good (80+)</span>
                <div style={{width:12,height:8,borderRadius:2,background:C.amber,flexShrink:0}}/><span>Watch (65–79)</span>
                <div style={{width:12,height:8,borderRadius:2,background:C.red,flexShrink:0}}/><span>Concern (&lt;65)</span>
                <div style={{width:12,height:8,borderRadius:2,background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',flexShrink:0}}/><span>Not submitted</span>
              </div>
            </div>
          )}

          {mainTab==='checkins'&&(
            <div style={{background:C.s1,borderRadius:12,border:`1px solid ${C.border}`,overflow:'hidden'}}>
              <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:12,fontWeight:700,color:C.txt}}>Manual Check-In Entry</div>
                <div style={{fontSize:11,color:C.txt3}}>{players.filter(p=>p.checkedIn).length}/{players.length} submitted today</div>
              </div>
              {players.map(p=>(
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:`1px solid ${C.border}`}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:`${scoreColor(p.today||0)}14`,border:`1.5px solid ${scoreColor(p.today||0)}40`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:10,fontWeight:900,color:scoreColor(p.today||0),fontFamily:'var(--font-d)'}}>{p.num}</span>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:C.txt}}>{p.name}</div>
                    <div style={{fontSize:10,color:C.txt3}}>{p.pos}</div>
                  </div>
                  {p.checkedIn?(
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:20,color:scoreColor(p.today||0)}}>{p.today||'–'}</div>
                      <span style={{fontSize:10,color:C.goal,background:'rgba(46,212,122,0.1)',border:'1px solid rgba(46,212,122,0.25)',borderRadius:5,padding:'2px 7px',fontWeight:700}}>✓ In</span>
                    </div>
                  ):(
                    <button onClick={()=>openCheckin(p)} style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'rgba(182,255,43,0.1)',border:'1px solid rgba(182,255,43,0.3)',borderRadius:7,fontSize:12,fontWeight:700,color:C.lime,cursor:'pointer',transition:'all .12s'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(182,255,43,0.18)'}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(182,255,43,0.1)'}}>
                      + Enter Score
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Right detail panel */}
        {selected&&<PlayerDetailPanel player={selected} onClose={()=>setSelected(null)}/>}
      </div>

      {showCheckin&&<CheckInModal player={checkinPlayer} onClose={()=>setShowCheckin(false)} onSubmit={handleSubmit}/>}
      {showExport&&<ExportModal onClose={()=>setShowExport(false)} players={players}/>}

      <TweaksPanel>
        <TweakSection label="View Mode"/>
        <TweakRadio label="Role" value={tweaks.view} options={['coach','player']} onChange={v=>setTweak('view',v)}/>
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={tweaks.colorMode} options={['dark','light']} onChange={v=>setTweak('colorMode',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
