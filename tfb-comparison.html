<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TFB – Role × Device + Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tfb-responsive.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#111418;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const C = {
  lime:'#B6FF2B', green:'#0F3D2E', greenDark:'#0A2E20',
  bg:'#111418', s1:'#1C2128', s2:'#242B33',
  border:'rgba(255,255,255,0.07)', border2:'rgba(255,255,255,0.13)',
  txt:'#F0F2F4', txt2:'rgba(240,242,244,0.5)', txt3:'rgba(240,242,244,0.28)',
  goal:'#2ED47A', amber:'#FFB020', red:'#E5533D', sky:'#3FA9F5',
};

const ROLES = [
  {id:'td',         label:'Technical Director', color:'#B6FF2B', icon:'🏆', badge:'Admin'},
  {id:'coach',      label:'Head Coach',          color:'#2ED47A', icon:'⚽', badge:'Coach'},
  {id:'manager',    label:'Team Manager',         color:'#FFB020', icon:'📆', badge:'Staff'},
  {id:'player',     label:'Player',               color:'#8A8F98', icon:'👟', badge:'Player'},
  {id:'parent',     label:'Parent',               color:'#8A8F98', icon:'👨‍👩‍👦',badge:'Parent'},
];

// ── Mini TFB logo ─────────────────────────────────────────────────────────────
function MiniLogo({size=22}) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#0F3D2E" stroke="#B6FF2B" strokeWidth="2"/>
      <text x="20" y="26" textAnchor="middle" fill="#B6FF2B" fontFamily="Barlow Condensed" fontWeight="900" fontSize="13">TFB</text>
    </svg>
  );
}

// ── Shared Header bar ──────────────────────────────────────────────────────────
function AppHeader({title,subtitle,compact=false}) {
  return (
    <div style={{background:`linear-gradient(90deg,${C.greenDark},${C.green})`,padding:compact?'8px 10px':'10px 14px',display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid rgba(182,255,43,0.15)',flexShrink:0}}>
      <MiniLogo size={compact?18:22}/>
      <div>
        <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:compact?12:14,color:'#fff',letterSpacing:'0.04em',lineHeight:1}}>{title}</div>
        {subtitle&&<div style={{fontSize:compact?8:9.5,color:'rgba(182,255,43,0.65)',fontWeight:700,letterSpacing:'0.08em',marginTop:1}}>{subtitle}</div>}
      </div>
    </div>
  );
}

// ── Sidebar mini ──────────────────────────────────────────────────────────────
function MiniSidebar({items,active}) {
  return (
    <div style={{width:110,background:C.green,borderRight:'1px solid rgba(182,255,43,0.12)',display:'flex',flexDirection:'column',padding:'6px 4px',gap:1,flexShrink:0}}>
      {items.map((item,i)=>(
        <div key={i} style={{padding:'6px 8px',borderRadius:6,background:item.active?'rgba(182,255,43,0.12)':'transparent',borderLeft:`2px solid ${item.active?C.lime:'transparent'}`,fontSize:10,fontWeight:item.active?700:500,color:item.active?C.lime:'rgba(255,255,255,0.6)',display:'flex',alignItems:'center',gap:5,cursor:'pointer',whiteSpace:'nowrap'}}>
          <span style={{fontSize:10}}>{item.icon}</span>{item.label}
        </div>
      ))}
    </div>
  );
}

// ── Mobile bottom nav ──────────────────────────────────────────────────────────
function MobileBottomNav({items}) {
  return (
    <div style={{display:'flex',background:C.s1,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
      {items.map((item,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'7px 2px',gap:2,borderTop:item.active?`2px solid ${C.lime}`:'2px solid transparent'}}>
          <span style={{fontSize:15}}>{item.icon}</span>
          <span style={{fontSize:8,fontWeight:item.active?700:400,color:item.active?C.lime:'rgba(255,255,255,0.4)'}}>{item.label}</span>
        </div>
      ))}
    </div>
  );
}

// ── StatBadge ──────────────────────────────────────────────────────────────────
function Stat({label,value,color=C.lime}) {
  return (
    <div style={{background:'rgba(0,0,0,0.2)',borderRadius:6,padding:'6px 8px',textAlign:'center',border:'1px solid rgba(255,255,255,0.08)',flex:1}}>
      <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:16,color,lineHeight:1}}>{value}</div>
      <div style={{fontSize:8,color:'rgba(255,255,255,0.4)',fontWeight:600,marginTop:2,textTransform:'uppercase',letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{label}</div>
    </div>
  );
}

// ── COACH Desktop ──────────────────────────────────────────────────────────────
function CoachDesktop() {
  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:C.bg,fontFamily:'Barlow, sans-serif',overflow:'hidden'}}>
      <AppHeader title="THE FOOTBALL BLUEPRINT" subtitle="COACHING PLATFORM"/>
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <MiniSidebar items={[
          {icon:'🏠',label:'Dashboard',active:true},
          {icon:'👥',label:'Team'},
          {icon:'📅',label:'Sessions'},
          {icon:'🏟',label:'Gameday'},
          {icon:'📊',label:'Planner'},
          {icon:'💚',label:'Wellness'},
          {icon:'💬',label:'Chat'},
          {icon:'⚙️',label:'Settings'},
        ]}/>
        <div style={{flex:1,padding:'10px',overflow:'auto'}}>
          {/* Welcome */}
          <div style={{background:`linear-gradient(135deg,${C.greenDark},${C.green})`,borderRadius:10,padding:'12px 14px',marginBottom:10,border:'1px solid rgba(182,255,43,0.18)'}}>
            <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:18,color:'#fff',marginBottom:4}}>Good afternoon, <span style={{color:C.lime}}>Coach Tim</span>!</div>
            <div style={{display:'flex',gap:6}}>
              <Stat label="Next Match" value="Sat" color={C.lime}/>
              <Stat label="Sessions" value="3" color={C.sky}/>
              <Stat label="Available" value="9/11" color={C.goal}/>
              <Stat label="Wellness" value="82%" color={C.amber}/>
            </div>
          </div>
          {/* Widget grid 2-col */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {/* Next match */}
            <div style={{background:C.s1,borderRadius:8,padding:'10px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.lime,marginBottom:6}}>⚡ NEXT MATCH</div>
              <div style={{background:`linear-gradient(135deg,${C.greenDark},${C.green})`,borderRadius:7,padding:'8px',border:'1px solid rgba(182,255,43,0.2)',textAlign:'center'}}>
                <div style={{fontSize:8,color:'rgba(182,255,43,0.6)',marginBottom:4,fontWeight:700,letterSpacing:'0.1em'}}>NPL VIC · ROUND 7</div>
                <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:18,color:C.lime}}>MCC <span style={{color:'rgba(255,255,255,0.3)',fontSize:14}}>vs</span> BUL</div>
                <div style={{fontSize:9,color:'rgba(255,255,255,0.4)',marginTop:3}}>Sat 3 May · 2:00 PM</div>
              </div>
              <div style={{display:'flex',gap:4,marginTop:6}}>
                <div style={{flex:1,background:'rgba(46,212,122,0.12)',border:'1px solid rgba(46,212,122,0.25)',borderRadius:5,padding:'4px',textAlign:'center',fontSize:10,fontWeight:700,color:C.goal}}>9 ✓</div>
                <div style={{flex:1,background:'rgba(255,176,32,0.12)',border:'1px solid rgba(255,176,32,0.25)',borderRadius:5,padding:'4px',textAlign:'center',fontSize:10,fontWeight:700,color:C.amber}}>1 ?</div>
                <div style={{flex:1,background:'rgba(229,83,61,0.12)',border:'1px solid rgba(229,83,61,0.25)',borderRadius:5,padding:'4px',textAlign:'center',fontSize:10,fontWeight:700,color:C.red}}>1 ✗</div>
              </div>
            </div>
            {/* Schedule */}
            <div style={{background:C.s1,borderRadius:8,padding:'10px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.lime,marginBottom:6}}>📅 SCHEDULE</div>
              {[['Thu','Technical: Ball Mastery','#3FA9F5'],['Sat','vs Bulleen Lions','#E5533D'],['Tue','Tactical: Pressing','#B6FF2B']].map(([d,t,c])=>(
                <div key={d} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}>
                  <div style={{width:3,height:28,borderRadius:2,background:c,flexShrink:0}}/>
                  <div>
                    <div style={{fontSize:10,fontWeight:600,color:C.txt,lineHeight:1.2}}>{t}</div>
                    <div style={{fontSize:8.5,color:C.txt3}}>{d}</div>
                  </div>
                </div>
              ))}
            </div>
            {/* Squad */}
            <div style={{background:C.s1,borderRadius:8,padding:'10px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.lime,marginBottom:6}}>👥 SQUAD STATUS</div>
              {[['J. Mitchell','GK','available'],['B. Tremblay','CM','available'],['L. Santos','LB','injured'],['K. Mensah','RW','late']].map(p=>(
                <div key={p[0]} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:`1px solid ${C.border}`}}>
                  <div style={{width:20,height:20,borderRadius:'50%',background:`${p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber}18`,border:`1px solid ${p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber}40`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:7,fontWeight:900,color:p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber,fontFamily:'Barlow Condensed'}}>1</span>
                  </div>
                  <span style={{flex:1,fontSize:10,color:C.txt}}>{p[0]}</span>
                  <span style={{fontSize:8,fontWeight:700,color:p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber,background:`${p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber}15`,border:`1px solid ${p[2]==='available'?C.goal:p[2]==='injured'?C.red:C.amber}30`,borderRadius:3,padding:'1px 4px'}}>{p[2].toUpperCase()}</span>
                </div>
              ))}
            </div>
            {/* Quick actions */}
            <div style={{background:C.s1,borderRadius:8,padding:'10px',border:`1px solid ${C.border}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.lime,marginBottom:6}}>⚡ QUICK ACTIONS</div>
              {[['⚽','New Session',C.lime],['🔔','Send Availability',C.sky],['📊','Block Planner',C.amber],['💬','Team Chat',C.goal]].map(([icon,label,c])=>(
                <div key={label} style={{display:'flex',alignItems:'center',gap:7,padding:'6px 8px',background:C.s2,borderRadius:6,marginBottom:4,cursor:'pointer',border:`1px solid ${C.border}`}}>
                  <span style={{fontSize:12}}>{icon}</span>
                  <span style={{fontSize:10,fontWeight:600,color:C.txt}}>{label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── COACH Mobile ──────────────────────────────────────────────────────────────
function CoachMobile() {
  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:C.bg,fontFamily:'Barlow, sans-serif',overflow:'hidden'}}>
      <AppHeader title="DASHBOARD" subtitle="MALVERN CITY U18" compact/>
      <div style={{flex:1,overflowY:'auto',padding:'10px 10px 0'}}>
        {/* Hero */}
        <div style={{background:`linear-gradient(135deg,${C.greenDark},${C.green})`,borderRadius:10,padding:'10px 12px',marginBottom:8,border:'1px solid rgba(182,255,43,0.18)'}}>
          <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:16,color:'#fff',marginBottom:6}}>Hey, <span style={{color:C.lime}}>Coach Tim</span>!</div>
          <div style={{display:'flex',gap:4}}>
            <Stat label="Next" value="Sat" color={C.lime}/>
            <Stat label="Squad" value="9/11" color={C.goal}/>
            <Stat label="W%" value="67%" color={C.sky}/>
          </div>
        </div>
        {/* RSVP alert */}
        <div style={{background:'rgba(255,176,32,0.08)',border:'1px solid rgba(255,176,32,0.25)',borderRadius:8,padding:'8px 10px',marginBottom:8,display:'flex',alignItems:'center',gap:7}}>
          <span style={{fontSize:14}}>🔔</span>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:C.amber}}>1 availability pending</div>
            <div style={{fontSize:9,color:C.txt3}}>K. Mensah hasn't responded for Saturday</div>
          </div>
        </div>
        {/* Next session */}
        <div style={{background:C.s1,borderRadius:8,padding:'10px',marginBottom:8,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:9,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}}>Next Session</div>
          <div style={{fontSize:12,fontWeight:700,color:C.txt}}>Technical: Ball Mastery</div>
          <div style={{fontSize:9.5,color:C.txt3,marginTop:2}}>Thu 1 May · 6:00 PM · 60min</div>
          <div style={{display:'flex',gap:5,marginTop:7}}>
            <div style={{flex:1,padding:'5px 8px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,borderRadius:6,textAlign:'center',fontSize:10,fontWeight:800,color:C.green}}>View Session</div>
            <div style={{flex:1,padding:'5px 8px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:6,textAlign:'center',fontSize:10,fontWeight:700,color:C.txt2}}>Gameday →</div>
          </div>
        </div>
        {/* Squad quick view */}
        <div style={{background:C.s1,borderRadius:8,padding:'10px',marginBottom:8,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:9,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>Squad Today</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {['JM','AN','MO','TK','BT','CW','RA','OP','KM','DK','FB'].map((p,i)=>(
              <div key={p} style={{width:28,height:28,borderRadius:'50%',background:i===2?'rgba(229,83,61,0.15)':i===9?'rgba(255,176,32,0.15)':'rgba(46,212,122,0.12)',border:`1.5px solid ${i===2?C.red:i===9?C.amber:C.goal}40`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <span style={{fontSize:8,fontWeight:800,color:i===2?C.red:i===9?C.amber:C.goal,fontFamily:'Barlow Condensed'}}>{p}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <MobileBottomNav items={[
        {icon:'🏠',label:'Home',active:true},
        {icon:'📅',label:'Schedule'},
        {icon:'👥',label:'Squad'},
        {icon:'🏟',label:'Gameday'},
        {icon:'⋯',label:'More'},
      ]}/>
    </div>
  );
}

// ── TD Desktop ─────────────────────────────────────────────────────────────────
function TDDesktop() {
  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:C.bg,fontFamily:'Barlow, sans-serif',overflow:'hidden'}}>
      <AppHeader title="CLUB OVERVIEW" subtitle="MALVERN CITY FC · TECHNICAL DIRECTOR"/>
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <MiniSidebar items={[
          {icon:'🏠',label:'Dashboard',active:true},
          {icon:'🏆',label:'Club Overview'},
          {icon:'👥',label:'All Teams'},
          {icon:'📊',label:'Analytics'},
          {icon:'📋',label:'Recruitment'},
          {icon:'💬',label:'Comms'},
          {icon:'⚙️',label:'Settings'},
        ]}/>
        <div style={{flex:1,padding:'10px',overflow:'auto'}}>
          {/* Club stats */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:10}}>
            {[['102','Total Players',C.lime],['87%','Avg Attend.',C.goal],['83%','Avg Wellness',C.amber],['23','Total Wins',C.sky]].map(([v,l,c])=>(
              <div key={l} style={{background:`linear-gradient(135deg,${C.greenDark},${C.green})`,borderRadius:8,padding:'8px 10px',border:'1px solid rgba(182,255,43,0.15)'}}>
                <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:22,color:c,lineHeight:1}}>{v}</div>
                <div style={{fontSize:8,color:'rgba(255,255,255,0.4)',fontWeight:700,marginTop:2,textTransform:'uppercase',letterSpacing:'0.04em'}}>{l}</div>
              </div>
            ))}
          </div>
          {/* Teams grid */}
          <div style={{fontSize:9,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>6 Teams · NPL Victoria</div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {[
              {name:'U18 Men',coach:'Tim Brand',att:'89%',w:82,pts:13,pos:2,color:C.lime},
              {name:'U18 Women',coach:'Lisa Park',att:'93%',w:90,pts:18,pos:1,color:C.sky},
              {name:'U14 Boys',coach:"James O'Brien",att:'91%',w:85,pts:15,pos:1,color:C.goal},
              {name:'Senior Men',coach:'Dave K.',att:'76%',w:74,pts:9,pos:6,color:C.red},
            ].map(t=>(
              <div key={t.name} style={{background:C.s1,borderRadius:7,padding:'7px 10px',border:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:7,height:7,borderRadius:'50%',background:t.color,flexShrink:0}}/>
                <span style={{fontFamily:'Barlow Condensed',fontWeight:800,fontSize:13,color:C.txt,flex:1,minWidth:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t.name}</span>
                <span style={{fontSize:8.5,color:C.txt3,minWidth:55,whiteSpace:'nowrap'}}>{t.coach}</span>
                <span style={{fontSize:10,fontWeight:700,color:t.att>='90%'?C.goal:C.amber}}>{t.att}</span>
                <span style={{fontSize:10,fontWeight:700,color:t.w>=80?C.goal:C.amber}}>{t.w}%</span>
                <span style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:13,color:t.pos<=2?C.lime:C.txt2}}>{t.pts}pts</span>
              </div>
            ))}
          </div>
          {/* Alerts */}
          <div style={{marginTop:10,background:C.s1,borderRadius:8,padding:'8px 10px',border:`1px solid ${C.border}`}}>
            <div style={{fontSize:9,fontWeight:700,color:C.amber,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:5}}>⚠ Club Alerts</div>
            {[['Senior Men: 3 players below 60% wellness','amber'],['U18 Men: L. Santos out 3 weeks','red'],['4 outstanding registration fees','sky']].map(([msg,type])=>(
              <div key={msg} style={{fontSize:9.5,color:type==='amber'?C.amber:type==='red'?C.red:C.sky,padding:'3px 0',borderBottom:`1px solid ${C.border}`}}>{msg}</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── PLAYER Mobile ──────────────────────────────────────────────────────────────
function PlayerMobile() {
  return (
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:C.bg,fontFamily:'Barlow, sans-serif',overflow:'hidden'}}>

      <div style={{flex:1,overflowY:'auto',padding:'10px 10px 0'}}>

        <div style={{background:`linear-gradient(135deg,${C.greenDark},${C.green})`,borderRadius:10,padding:'10px 12px',marginBottom:8,border:'1px solid rgba(182,255,43,0.18)'}}>
          <div style={{fontFamily:'Barlow Condensed',fontWeight:900,fontSize:16,color:'#fff',marginBottom:6}}>Hey, <span style={{color:C.lime}}>Oscar</span>! 👟</div>

          <span style={{fontSize:18}}>💚</span>

          </div>
          <div style={{marginLeft:'auto',fontSize:14,color:C.goal}}>›</div>
        </div>
        {/* RSVP needed */}
        <div style={{background:C.s1,borderRadius:8,padding:'10px',marginBottom:8,border:'1px solid rgba(255,176,32,0.25)'}}>

function ChatMessage({msg, isOwn=false}) {

  if(isAnnouncement) {
    return (
      <div style={{margin:'8px 0',background:'rgba(182,255,43,0.06)',border:'1px solid rgba(182,255,43,0.2)',borderRadius:10,padding:'10px 12px'}}>

          </div>
          <span style={{fontSize:11,fontWeight:700,color:C.lime}}>Tim Brand</span>

          <span style={{fontSize:9,color:C.txt3,marginLeft:'auto'}}>{msg.time}</span>
        </div>
        <p style={{fontSize:12,color:C.txt,lineHeight:1.5}}>{msg.text}</p>
        {msg.reactions&&(
          <div style={{display:'flex',gap:4,marginTop:6}}>
            {msg.reactions.map(r=>(
              <span key={r} style={{fontSize:10,background:'rgba(255,255,255,0.06)',border:`1px solid ${C.border2}`,borderRadius:5,padding:'2px 7px',color:C.txt2,cursor:'pointer'}}>{r}</span>
            ))}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{display:'flex',gap:8,margin:'5px 0',alignItems:'flex-end',flexDirection:isOwn?'row-reverse':'row'}}>
      <div style={{width:26,height:26,borderRadius:'50%',background:`${roleColors[msg.role]||C.txt2}18`,border:`1px solid ${roleColors[msg.role]||C.txt2}30`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <span style={{fontSize:9,fontWeight:900,color:roleColors[msg.role]||C.txt2,fontFamily:'Barlow Condensed'}}>{msg.from.split(' ').map(x=>x[0]).join('')}</span>

      <div style={{maxWidth:'72%'}}>
        {!isOwn&&<div style={{fontSize:9,color:roleColors[msg.role]||C.txt2,marginBottom:2,fontWeight:700}}>{msg.from} <span style={{fontWeight:400,color:C.txt3}}>· {roleLabels[msg.role]}</span></div>}

        </div>
        <div style={{fontSize:9,color:C.txt3,marginTop:2,textAlign:isOwn?'right':'left'}}>{msg.time}</div>
      </div>
    </div>
  );
}

                <div style={{fontSize:11,fontWeight:700,color:C.goal,letterSpacing:'0.08em',textTransform:'uppercase'}}>Desktop</div>
                <Desktop><CoachDesktop/></Desktop>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
                <div style={{fontSize:11,fontWeight:700,color:C.goal,letterSpacing:'0.08em',textTransform:'uppercase'}}>Mobile</div>
                <Phone><CoachMobile/></Phone>
              </div>
            </div>
          </div>
        </DCArtboard>

        {/* Player mobile */}
        <DCArtboard id="player-mobile" label="Player — Mobile" width={300} height={540}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:12}}>
            <RoleLabel role="👟 Player" color='#8A8F98'/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Mobile-first: wellness, RSVPs, goals, messages</p>
            <div style={{flex:1,display:'flex',justifyContent:'center',alignItems:'center'}}>
              <Phone><PlayerMobile/></Phone>
            </div>
          </div>
        </DCArtboard>

        {/* Parent mobile */}
        <DCArtboard id="parent-mobile" label="Parent — Mobile" width={300} height={540}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:12}}>
            <RoleLabel role="👨‍👩‍👦 Parent" color='#8A8F98'/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Child-focused view: their stats, next match, coach messages, fees</p>
            <div style={{flex:1,display:'flex',justifyContent:'center',alignItems:'center'}}>
              <Phone><ParentMobile/></Phone>
            </div>
          </div>
        </DCArtboard>

        {/* Manager mobile */}
        <DCArtboard id="manager-mobile" label="Team Manager — Mobile" width={300} height={540}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:12}}>
            <RoleLabel role="📆 Team Manager" color={C.amber}/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Availability, logistics, match day ops, comms</p>
            <div style={{flex:1,display:'flex',justifyContent:'center',alignItems:'center'}}>
              <Phone><ManagerMobile/></Phone>
            </div>
          </div>
        </DCArtboard>

      </DCSection>

      <DCSection id="chat" title="Team Chat — Role Views">

        <DCArtboard id="chat-coach" label="Chat — Coach View" width={600} height={440}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:10}}>
            <RoleLabel role="⚽ Coach View" color={C.goal}/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Can send announcements (pinned style), moderate, DM any member</p>
            <div style={{flex:1,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border2}`}}>
              <ChatView role="coach"/>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="chat-player" label="Chat — Player View" width={600} height={440}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:10}}>
            <RoleLabel role="👟 Player View" color='#8A8F98'/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Team chat + DM coach only. Own messages appear on right.</p>
            <div style={{flex:1,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border2}`}}>
              <ChatView role="player"/>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="chat-parent" label="Chat — Parent View" width={600} height={440}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:10}}>
            <RoleLabel role="👨‍👩‍👦 Parent View" color={C.sky}/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Team chat (read/send) + DM team manager for logistics only</p>
            <div style={{flex:1,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border2}`}}>
              <ChatView role="parent"/>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="chat-manager" label="Chat — Manager View" width={600} height={440}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',display:'flex',flexDirection:'column',height:'100%',gap:10}}>
            <RoleLabel role="📆 Manager View" color={C.amber}/>
            <p style={{fontSize:12,color:C.txt3,textAlign:'center',marginBottom:4}}>Team chat + DM any member. Handle logistics, parent queries.</p>
            <div style={{flex:1,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border2}`}}>
              <ChatView role="manager"/>
            </div>
          </div>
        </DCArtboard>

      </DCSection>

      <DCSection id="permissions" title="Chat Permission Matrix">
        <DCArtboard id="chat-perms" label="Who can message whom" width={700} height={320}>
          <div style={{fontFamily:'Barlow, sans-serif',color:'#fff',height:'100%',display:'flex',flexDirection:'column',gap:14}}>
            <p style={{fontSize:13,color:C.txt2,lineHeight:1.6}}>
              Chat permissions follow the role hierarchy. Coaches control announcements. Players and parents have limited DM access to protect privacy and reduce noise.
            </p>
            <div style={{background:C.s1,borderRadius:10,overflow:'hidden',border:`1px solid ${C.border}`}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                <thead>
                  <tr style={{background:C.s2}}>
                    <th style={{padding:'8px 14px',textAlign:'left',color:C.txt3,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em'}}>Role</th>
                    {['Team Chat','Coach DM','Manager DM','Player DM','Parent DM','Announcements'].map(h=>(
                      <th key={h} style={{padding:'8px 8px',textAlign:'center',color:C.txt3,fontWeight:700,fontSize:9,textTransform:'uppercase',letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[
                    {role:'Technical Director',color:C.lime,perms:[true,true,true,true,true,true]},
                    {role:'Head Coach',color:C.goal,perms:[true,true,true,true,false,true]},
                    {role:'Asst. Coach',color:C.amber,perms:[true,true,true,true,false,false]},
                    {role:'Team Manager',color:C.amber,perms:[true,true,true,true,true,false]},
                    {role:'Player',color:'#8A8F98',perms:[true,true,false,false,false,false]},
                    {role:'Parent',color:C.sky,perms:[true,false,true,false,false,false]},
                  ].map((row,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.border}`}}>
                      <td style={{padding:'8px 14px',whiteSpace:'nowrap'}}>
                        <span style={{fontSize:12,fontWeight:700,color:row.color}}>{row.role}</span>
                      </td>
                      {row.perms.map((p,j)=>(
                        <td key={j} style={{padding:'8px',textAlign:'center',fontSize:14}}>
                          {p?<span style={{color:C.goal}}>✓</span>:<span style={{color:'rgba(255,255,255,0.1)'}}>–</span>}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p style={{fontSize:11,color:C.txt3}}>
              * Players can only DM their own coach. Parents can only DM the team manager. All messages are moderated by the club admin.
            </p>
          </div>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
