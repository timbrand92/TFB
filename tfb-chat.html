<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TFB – Team Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tfb-responsive.jsx"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--lime:#B6FF2B;--green:#0F3D2E;--green-dark:#0A2E20;--bg:#111418;--s1:#1C2128;--s2:#242B33;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--txt:#F0F2F4;--txt2:rgba(240,242,244,0.5);--txt3:rgba(240,242,244,0.28);--goal:#2ED47A;--amber:#FFB020;--red:#E5533D;--sky:#3FA9F5;--font-d:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;--hh:54px;}
html,body,#root{height:100%;overflow:hidden}body{font-family:var(--font-b);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:var(--font-b);color:inherit}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.msg{animation:fadeIn .15s ease forwards}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const C={lime:'#B6FF2B',green:'#0F3D2E',greenDark:'#0A2E20',bg:'#111418',s1:'#1C2128',s2:'#242B33',border:'rgba(255,255,255,0.07)',border2:'rgba(255,255,255,0.13)',txt:'#F0F2F4',txt2:'rgba(240,242,244,0.5)',txt3:'rgba(240,242,244,0.28)',goal:'#2ED47A',amber:'#FFB020',red:'#E5533D',sky:'#3FA9F5'};
const Ic=({d,size=16,color='currentColor',stroke=2,fill='none'})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/> }</svg>);
const P={back:'M15 18l-6-6 6-6',send:'M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z',plus:'M12 5v14M5 12h14',search:'M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z',pin:'M3 15l5.12-5.12A3 3 0 0 1 10 9.67l2.9-2.9a3 3 0 0 1 4.24 0l2.09 2.09a3 3 0 0 1 0 4.24l-2.9 2.9a3 3 0 0 1-1.21.77L9 21',image:['M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z','M8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 0L21 21M3 16l5-5 4 4']};

const THREADS=[
  {id:1,name:'Team Chat',icon:'👥',desc:'Malvern City U18 Men',unread:3,type:'group',pinned:true},
  {id:2,name:'Coaches Only',icon:'⚽',desc:'Coaching staff only',unread:0,type:'group',pinned:true},
  {id:3,name:'Tim Brand',icon:'⚽',desc:'Head Coach · Direct',unread:0,type:'direct',role:'coach'},
  {id:4,name:'Kelly Chan',icon:'📆',desc:'Team Manager',unread:1,type:'direct',role:'manager'},
  {id:5,name:'James Walsh',icon:'📋',desc:'Assistant Coach',unread:0,type:'direct',role:'asst'},
];

const INIT_MESSAGES=[
  {id:1,from:'Tim Brand',role:'coach',time:'9:14 AM',text:'Good session yesterday everyone. Thursday we focus on ball mastery. Be ready at 5:50pm sharp.',type:'announcement',reactions:[{emoji:'👍',count:8},{emoji:'⚽',count:3}]},
  {id:2,from:'Beau Tremblay',role:'player',time:'9:22 AM',text:'See you Thursday Coach! 🤜',type:'normal'},
  {id:3,from:'Oscar Petersen',role:'player',time:'9:25 AM',text:'Who is bringing the bibs on Thursday?',type:'normal'},
  {id:4,from:'Jacopo Rossi',role:'player',time:'9:26 AM',text:'I can bring them 👍',type:'normal'},
  {id:5,from:'Tim Brand',role:'coach',time:'9:30 AM',text:'Thanks Jacopo. Also reminder — availability request for Saturday vs Bulleen Lions is still open. Please RSVP ASAP.',type:'announcement',reactions:[{emoji:'✓',count:6}]},
  {id:6,from:'Damian Kowalski',role:'player',time:'9:45 AM',text:'Already responded Coach ✅',type:'normal'},
  {id:7,from:'System',role:'system',time:'10:00 AM',text:'📢 Availability request sent: Saturday 3 May vs Bulleen Lions · 11 responses received',type:'system'},
  {id:8,from:'Cian Walsh',role:'player',time:'11:30 AM',text:'Running 5 mins late Thursday — traffic. Sorry Coach!',type:'normal'},
  {id:9,from:'Tim Brand',role:'coach',time:'11:35 AM',text:'No worries Cian, warm up yourself when you arrive.',type:'normal'},
];

const roleColors={coach:C.lime,player:C.txt2,manager:C.amber,asst:C.sky,system:C.txt3};
const ME='Tim Brand';

function Avatar({name,role,size=32}){
  const initials=name.split(' ').map(x=>x[0]).join('').slice(0,2);
  const color=roleColors[role]||C.txt2;
  return(<div style={{width:size,height:size,borderRadius:'50%',background:`${color}18`,border:`1.5px solid ${color}35`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
    <span style={{fontSize:size*0.34,fontWeight:900,color,fontFamily:'var(--font-d)'}}>{initials}</span>
  </div>);}

function Header({onBack}){return(<header style={{height:'var(--hh)',background:`linear-gradient(90deg,${C.greenDark},${C.green})`,borderBottom:'1px solid rgba(182,255,43,0.18)',display:'flex',alignItems:'center',gap:12,padding:'0 20px',flexShrink:0,zIndex:50}}>
  <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'rgba(255,255,255,0.7)',fontSize:12,fontWeight:600,cursor:'pointer'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(182,255,43,0.12)';e.currentTarget.style.color='#B6FF2B'}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,0.07)';e.currentTarget.style.color='rgba(255,255,255,0.7)'}}>
    <Ic d={P.back} size={14} color="currentColor"/> Dashboard
  </button>
  <div style={{width:1,height:24,background:'rgba(255,255,255,0.12)'}}/>
  <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#0F3D2E" stroke="#B6FF2B" strokeWidth="1.5"/><text x="20" y="26" textAnchor="middle" fill="#B6FF2B" fontFamily="Barlow Condensed" fontWeight="900" fontSize="13">TFB</text></svg>
  <div><div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:17,color:'#fff',letterSpacing:'0.04em',lineHeight:1}}>TEAM CHAT</div><div style={{fontSize:9.5,color:'rgba(182,255,43,0.65)',fontWeight:700,letterSpacing:'0.1em'}}>Malvern City U18 Men</div></div>
</header>);}

// Determine current role (synced with dashboard tweaks via localStorage)
function getCurrentRole(){
  try {
    const saved = localStorage.getItem('tfb_role');
    if (saved) return saved;
    const tweakBlock = (document.documentElement.innerHTML.match(/EDITMODE-BEGIN\*\/(.*?)\/\*EDITMODE-END/s)||[])[1];
    if (tweakBlock) return JSON.parse(tweakBlock).role || 'Coach';
  } catch(e){}
  return 'Coach';
}
// Who can create what kind of chat?
const CHAT_PERMS = {
  'Coach':              { canCreate:true, kinds:['team','group','direct'], note:'Create team chats, coach-only groups, direct messages with players or parents.' },
  'Technical Director': { canCreate:true, kinds:['team','group','direct','club'], note:'Create club-wide and cross-team channels.' },
  'Club Admin':         { canCreate:true, kinds:['club','group','direct'], note:'Create club-wide announcements and committee groups.' },
  'Player':             { canCreate:true, kinds:['direct'], note:'Send direct messages to coaches or teammates only.' },
  'Parent':             { canCreate:true, kinds:['direct'], note:'Send direct messages to coaches or team manager only.' },
};

function App(){
  const [role] = useState(getCurrentRole());
  const perms = CHAT_PERMS[role] || CHAT_PERMS['Coach'];
  const [threads,setThreads]=useState(THREADS);
  const [activeThread,setActiveThread]=useState(1);
  const [messages,setMessages]=useState(INIT_MESSAGES);
  const [input,setInput]=useState('');
  const [showAnnounce,setShowAnnounce]=useState(false);
  const [announceText,setAnnounceText]=useState('');
  const [showNewChat,setShowNewChat]=useState(false);
  const bottomRef=useRef(null);
  const thread=threads.find(t=>t.id===activeThread);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const send=()=>{
    if(!input.trim()) return;
    setMessages(prev=>[...prev,{id:Date.now(),from:ME,role:'coach',time:new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),text:input,type:'normal'}]);
    setInput('');
  };

  const sendAnnounce=()=>{
    if(!announceText.trim()) return;
    setMessages(prev=>[...prev,{id:Date.now(),from:ME,role:'coach',time:new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),text:announceText,type:'announcement',reactions:[]}]);
    setAnnounceText('');
    setShowAnnounce(false);
  };

  return(<div style={{height:'100vh',display:'flex',flexDirection:'column',background:C.bg,overflow:'hidden'}}>
    <Header onBack={()=>{try{window.location.href='tfb-dashboard.html'}catch(e){}}}/>
    <div style={{flex:1,display:'flex',overflow:'hidden'}}>
      {/* Thread list */}
      <div style={{width:260,background:C.s1,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'10px 10px 6px'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:8,padding:'6px 10px',marginBottom:8}}>
            <Ic d={P.search} size={13} color={C.txt3}/>
            <input placeholder="Search messages…" style={{background:'transparent',border:'none',outline:'none',fontSize:12,color:C.txt,flex:1}}/>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'0 8px'}}>
          {/* Pinned */}
          <div style={{fontSize:9.5,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',padding:'6px 6px 4px'}}>Pinned</div>
          {threads.filter(t=>t.pinned).map(t=>{
            const active=activeThread===t.id;
            return(<button key={t.id} onClick={()=>setActiveThread(t.id)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 10px',background:active?'rgba(182,255,43,0.08)':'transparent',border:'none',borderLeft:`3px solid ${active?C.lime:'transparent'}`,borderRadius:active?'0 8px 8px 0':8,cursor:'pointer',marginBottom:2,transition:'all .12s',textAlign:'left'}} onMouseEnter={e=>{if(!active)e.currentTarget.style.background='rgba(255,255,255,0.03)'}} onMouseLeave={e=>{if(!active)e.currentTarget.style.background='transparent'}}>
              <div style={{width:36,height:36,borderRadius:10,background:'rgba(182,255,43,0.1)',border:`1px solid rgba(182,255,43,0.2)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:16}}>{t.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:13,fontWeight:700,color:active?C.lime:C.txt,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.name}</span>
                  {t.unread>0&&<div style={{width:18,height:18,borderRadius:'50%',background:C.lime,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:9,fontWeight:900,color:C.green}}>{t.unread}</span></div>}
                </div>
                <div style={{fontSize:10.5,color:C.txt3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.desc}</div>
              </div>
            </button>);
          })}
          {/* Direct */}
          <div style={{fontSize:9.5,fontWeight:700,color:C.txt3,textTransform:'uppercase',letterSpacing:'0.1em',padding:'10px 6px 4px'}}>Direct Messages</div>
          {threads.filter(t=>!t.pinned).map(t=>{
            const active=activeThread===t.id;
            return(<button key={t.id} onClick={()=>setActiveThread(t.id)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:active?'rgba(182,255,43,0.08)':'transparent',border:'none',borderLeft:`3px solid ${active?C.lime:'transparent'}`,borderRadius:active?'0 8px 8px 0':8,cursor:'pointer',marginBottom:2,transition:'all .12s',textAlign:'left'}}>
              <div style={{width:32,height:32,borderRadius:'50%',background:`${roleColors[t.role]||C.lime}18`,border:`1px solid ${roleColors[t.role]||C.lime}30`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:14}}>{t.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:12.5,fontWeight:600,color:active?C.lime:C.txt}}>{t.name}</span>
                  {t.unread>0&&<div style={{width:16,height:16,borderRadius:'50%',background:C.lime,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:8,fontWeight:900,color:C.green}}>{t.unread}</span></div>}
                </div>
                <div style={{fontSize:10,color:C.txt3}}>{t.desc}</div>
              </div>
            </button>);
          })}
        </div>
        {/* New chat button + role indicator */}
        <div style={{padding:'10px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:C.txt3,fontWeight:700,marginBottom:6,textAlign:'center'}}>You · <span style={{color:C.lime}}>{role}</span></div>
          {perms.canCreate ? (
            <button onClick={()=>setShowNewChat(true)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:'9px',background:`linear-gradient(135deg,${C.lime},#68B42E)`,border:'none',borderRadius:8,fontSize:12,fontWeight:800,color:C.green,cursor:'pointer',transition:'transform .12s'}}>
              <Ic d={P.plus} size={14} color={C.green}/> New Chat
            </button>
          ) : (
            <div style={{padding:'8px',fontSize:10,color:C.txt3,textAlign:'center',background:C.s2,borderRadius:6}}>Read-only role</div>
          )}
          <div style={{fontSize:9.5,color:C.txt3,marginTop:8,lineHeight:1.4,textAlign:'center'}}>{perms.note}</div>
        </div>
      </div>

      {/* Chat area */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Chat header */}
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,background:C.s1,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{fontSize:20}}>{thread?.icon}</div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:C.txt}}>{thread?.name}</div>
              <div style={{fontSize:11,color:C.txt3}}>{thread?.id===1?'18 members · Malvern City U18 Men':thread?.desc}</div>
            </div>
          </div>
          {thread?.id===1&&(
            <button onClick={()=>setShowAnnounce(!showAnnounce)} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 14px',background:showAnnounce?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(182,255,43,0.1)',border:`1px solid rgba(182,255,43,0.3)`,borderRadius:8,fontSize:12,fontWeight:700,color:showAnnounce?C.green:C.lime,cursor:'pointer',transition:'all .15s'}}>
              📢 Announce
            </button>
          )}
        </div>

        {/* Announce compose */}
        {showAnnounce&&(
          <div style={{padding:'12px 16px',background:'rgba(182,255,43,0.04)',borderBottom:`1px solid rgba(182,255,43,0.15)`}}>
            <div style={{fontSize:11,fontWeight:700,color:C.lime,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.08em'}}>📢 Team Announcement</div>
            <textarea value={announceText} onChange={e=>setAnnounceText(e.target.value)} placeholder="Type your announcement…" rows={2}
              style={{width:'100%',background:C.s2,border:'1px solid rgba(182,255,43,0.3)',borderRadius:8,color:C.txt,fontSize:13,padding:'8px 12px',resize:'none',outline:'none',lineHeight:1.5,marginBottom:8}}/>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>setShowAnnounce(false)} style={{padding:'6px 14px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:7,fontSize:12,fontWeight:600,color:C.txt2,cursor:'pointer'}}>Cancel</button>
              <button onClick={sendAnnounce} disabled={!announceText.trim()} style={{padding:'6px 16px',background:announceText.trim()?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(255,255,255,0.07)',border:'none',borderRadius:7,fontSize:12,fontWeight:800,color:announceText.trim()?C.green:C.txt3,cursor:announceText.trim()?'pointer':'not-allowed'}}>Send to Team</button>
            </div>
          </div>
        )}

        {/* Messages */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:4}}>
          {messages.map(msg=>{
            const isMe=msg.from===ME;
            const isAnnounce=msg.type==='announcement';
            const isSystem=msg.type==='system';
            if(isSystem) return(
              <div key={msg.id} style={{textAlign:'center',padding:'6px 0'}}>
                <span style={{fontSize:11,color:C.txt3,background:C.s2,border:`1px solid ${C.border}`,borderRadius:6,padding:'3px 12px'}}>{msg.text}</span>
              </div>
            );
            if(isAnnounce) return(
              <div key={msg.id} className="msg" style={{background:'rgba(182,255,43,0.06)',border:'1px solid rgba(182,255,43,0.2)',borderRadius:12,padding:'12px 14px',margin:'4px 0'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
                  <Avatar name={msg.from} role={msg.role} size={28}/>
                  <span style={{fontSize:12,fontWeight:700,color:C.lime}}>{msg.from}</span>
                  <span style={{fontSize:9.5,color:C.txt3,background:'rgba(182,255,43,0.1)',border:'1px solid rgba(182,255,43,0.2)',borderRadius:3,padding:'1px 6px',fontWeight:700}}>📢 COACH</span>
                  <span style={{fontSize:10,color:C.txt3,marginLeft:'auto'}}>{msg.time}</span>
                </div>
                <p style={{fontSize:13,color:C.txt,lineHeight:1.5}}>{msg.text}</p>
                {msg.reactions?.length>0&&(
                  <div style={{display:'flex',gap:5,marginTop:8}}>
                    {msg.reactions.map((r,i)=>(<button key={i} style={{fontSize:12,background:'rgba(255,255,255,0.06)',border:`1px solid ${C.border2}`,borderRadius:6,padding:'3px 9px',cursor:'pointer',color:C.txt2,transition:'all .12s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.1)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}>{r.emoji} {r.count}</button>))}
                  </div>
                )}
              </div>
            );
            return(
              <div key={msg.id} className="msg" style={{display:'flex',gap:9,alignItems:'flex-end',flexDirection:isMe?'row-reverse':'row',margin:'2px 0'}}>
                {!isMe&&<Avatar name={msg.from} role={msg.role} size={26}/>}
                <div style={{maxWidth:'68%'}}>
                  {!isMe&&<div style={{fontSize:10,color:roleColors[msg.role]||C.txt2,marginBottom:2,fontWeight:700,paddingLeft:2}}>{msg.from}</div>}
                  <div style={{background:isMe?`linear-gradient(135deg,${C.lime},#68B42E)`:C.s2,borderRadius:isMe?'12px 12px 2px 12px':'12px 12px 12px 2px',padding:'9px 12px',border:`1px solid ${isMe?'transparent':C.border2}`}}>
                    <p style={{fontSize:13,color:isMe?C.green:C.txt,lineHeight:1.5,margin:0}}>{msg.text}</p>
                  </div>
                  <div style={{fontSize:9.5,color:C.txt3,marginTop:2,textAlign:isMe?'right':'left',paddingLeft:isMe?0:4}}>{msg.time}</div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef}/>
        </div>

        {/* Input */}
        <div style={{padding:'12px 16px',borderTop:`1px solid ${C.border}`,background:C.s1,display:'flex',gap:8,alignItems:'flex-end',flexShrink:0}}>
          <button style={{padding:'9px',background:C.s2,border:`1px solid ${C.border2}`,borderRadius:9,cursor:'pointer',display:'flex',flexShrink:0,transition:'background .15s'}} onMouseEnter={e=>e.currentTarget.style.background=C.s3} onMouseLeave={e=>e.currentTarget.style.background=C.s2}><Ic d={P.image} size={16} color={C.txt3}/></button>
          <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder={`Message ${thread?.name}…`} rows={1}
            style={{flex:1,background:C.s2,border:`1px solid ${C.border2}`,borderRadius:10,color:C.txt,fontSize:13,padding:'9px 12px',resize:'none',outline:'none',lineHeight:1.5,maxHeight:80,overflow:'auto',transition:'border-color .15s'}}
            onFocus={e=>e.target.style.borderColor='rgba(182,255,43,0.35)'} onBlur={e=>e.target.style.borderColor=C.border2}/>
          <button onClick={send} disabled={!input.trim()} style={{padding:'9px 14px',background:input.trim()?`linear-gradient(135deg,${C.lime},#68B42E)`:'rgba(255,255,255,0.07)',border:'none',borderRadius:9,cursor:input.trim()?'pointer':'not-allowed',display:'flex',alignItems:'center',gap:5,fontSize:12,fontWeight:800,color:input.trim()?C.green:C.txt3,flexShrink:0,transition:'opacity .15s'}} onMouseEnter={e=>{if(input.trim())e.currentTarget.style.opacity='.88'}} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <Ic d={P.send} size={14} color={input.trim()?C.green:C.txt3}/> Send
          </button>
        </div>

        {/* Permission note */}
        <div style={{padding:'4px 16px 6px',textAlign:'center',borderTop:`1px solid ${C.border}`}}>
          <span style={{fontSize:9.5,color:C.txt3}}>Coach: Can send announcements · DM any member · Moderate chat</span>
        </div>
      </div>
    </div>
    {showNewChat && (
      <div onClick={()=>setShowNewChat(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300,padding:20}}>
        <div onClick={e=>e.stopPropagation()} style={{background:C.s1,border:`1px solid ${C.border2}`,borderRadius:16,width:'100%',maxWidth:480,maxHeight:'85vh',overflow:'hidden',display:'flex',flexDirection:'column'}}>
          <div style={{padding:'16px 20px',borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontFamily:'var(--font-d)',fontWeight:900,fontSize:18,color:C.txt,letterSpacing:'0.04em'}}>NEW CHAT</div>
              <div style={{fontSize:11,color:C.txt3,marginTop:2}}>As <b style={{color:C.lime}}>{role}</b>, you can create:</div>
            </div>
            <button onClick={()=>setShowNewChat(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:22,cursor:'pointer',padding:4}}>×</button>
          </div>
          <div style={{padding:16,overflowY:'auto',flex:1}}>
            {[
              {k:'team',name:'Team Chat',icon:'👥',desc:'Group chat for one team — players, parents, staff.',allowed:perms.kinds.includes('team')},
              {k:'group',name:'Coach/Staff Group',icon:'⚽',desc:'Private group for coaching staff only.',allowed:perms.kinds.includes('group')},
              {k:'club',name:'Club-wide Channel',icon:'🏟',desc:'Reaches every member across all teams.',allowed:perms.kinds.includes('club')},
              {k:'direct',name:'Direct Message',icon:'💬',desc:'1-on-1 private conversation.',allowed:perms.kinds.includes('direct')},
            ].map(opt=>(
              <button key={opt.k} disabled={!opt.allowed} onClick={()=>{
                const newId = Date.now();
                setThreads(prev=>[...prev,{id:newId,name:opt.k==='direct'?'New conversation':opt.name+' (new)',icon:opt.icon,desc:'You created this · just now',unread:0,type:opt.k==='direct'?'direct':'group',pinned:opt.k!=='direct',role:'coach'}]);
                setActiveThread(newId);
                setShowNewChat(false);
              }} style={{width:'100%',display:'flex',gap:12,padding:'12px 14px',background:opt.allowed?C.s2:'rgba(255,255,255,0.02)',border:`1px solid ${opt.allowed?C.border2:C.border}`,borderRadius:10,marginBottom:8,cursor:opt.allowed?'pointer':'not-allowed',opacity:opt.allowed?1:0.4,textAlign:'left',transition:'all .15s'}} onMouseEnter={e=>{if(opt.allowed){e.currentTarget.style.borderColor='rgba(182,255,43,0.4)';e.currentTarget.style.background='rgba(182,255,43,0.05)'}}} onMouseLeave={e=>{if(opt.allowed){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.background=C.s2}}}>
                <div style={{fontSize:24,flexShrink:0}}>{opt.icon}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <div style={{fontSize:13.5,fontWeight:700,color:C.txt}}>{opt.name}</div>
                    {!opt.allowed && <span style={{fontSize:8.5,fontWeight:800,letterSpacing:'0.1em',color:C.txt3,background:'rgba(255,255,255,0.05)',padding:'1px 6px',borderRadius:3}}>NOT YOUR ROLE</span>}
                  </div>
                  <div style={{fontSize:11,color:C.txt3,marginTop:3,lineHeight:1.4}}>{opt.desc}</div>
                </div>
              </button>
            ))}
            <div style={{marginTop:12,padding:'10px 12px',background:'rgba(63,169,245,0.06)',border:'1px solid rgba(63,169,245,0.2)',borderRadius:8,fontSize:11,color:'#9DC8E8',lineHeight:1.5}}>
              <b style={{color:'#3FA9F5'}}>How it works</b><br/>
              Members are added by role: a Team Chat auto-includes the squad + assigned parents. Club channels reach everyone. Direct messages are 1-on-1 only. All chats sync in real-time when connected to your TFB account.
            </div>
          </div>
        </div>
      </div>
    )}
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
